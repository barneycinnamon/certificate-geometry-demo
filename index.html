    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;/style&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;certificate-geometry-intuition&#x27;);
  const innerControl = root.querySelector(&#x27;#cgi-inner&#x27;);
  const outerControl = root.querySelector(&#x27;#cgi-outer&#x27;);
  const angleControl = root.querySelector(&#x27;#cgi-angle&#x27;);
  const angleValue = root.querySelector(&#x27;#cgi-angle-value&#x27;);
  const orientationState = root.querySelector(&#x27;#cgi-orientation-state&#x27;);
  const optimumButton = root.querySelector(&#x27;#cgi-optimum&#x27;);
  const physicalSvg = root.querySelector(&#x27;#cgi-physical&#x27;);
  const bridgeSvg = root.querySelector(&#x27;#cgi-bridge&#x27;);
  const certificateSvg = root.querySelector(&#x27;#cgi-certificate&#x27;);
  const contactSummary = root.querySelector(&#x27;#cgi-contact-summary&#x27;);
  const generatorSummary = root.querySelector(&#x27;#cgi-generator-summary&#x27;);
  const cagePrevButton = root.querySelector(&#x27;#cgi-cage-prev&#x27;);
  const cageNextButton = root.querySelector(&#x27;#cgi-cage-next&#x27;);
  const cagePosition = root.querySelector(&#x27;#cgi-cage-position&#x27;);
  const certificateSummary = root.querySelector(&#x27;#cgi-certificate-summary&#x27;);
  const symmetryStatus = root.querySelector(&#x27;#cgi-symmetry-status&#x27;);
  const NS = &#x27;http://www.w3.org/2000/svg&#x27;;
  const TAU = 2 * Math.PI;
  let innerSides = 4;
  let outerSides = 8;
  let apothem = Math.cos(Math.PI / 8);
  let outerFrame = {vertices: [], facets: []};
  let normals = [];
  let cages = [];
  let innerReferencePhase = 0;
  let preferredGlobalPhi = 0;
  let certificateHull = [];
  let closestEdges = [];
  let globalAngles = [];
  let globalDistance = Infinity;
  let currentCageItems = [];
  let selectedCageItemKey = null;
  let selectedCageKey = null;

  const add = (a, b) =&gt; ({x: a.x + b.x, y: a.y + b.y});
  const sub = (a, b) =&gt; ({x: a.x - b.x, y: a.y - b.y});
  const scalePoint = (s, p) =&gt; ({x: s * p.x, y: s * p.y});
  const dot = (a, b) =&gt; a.x * b.x + a.y * b.y;
  const cross = (a, b) =&gt; a.x * b.y - a.y * b.x;
  const mod = (x, m) =&gt; ((x % m) + m) % m;
  const subscriptNumber = value =&gt; String(value).replace(/\d/g, digit =&gt; &#x27;₀₁₂₃₄₅₆₇₈₉&#x27;[Number(digit)]);

  function gcd(a, b) {
    while (b) [a, b] = [b, a % b];
    return a;
  }

  function node(name, attrs = {}) {
    const element = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([key, value]) =&gt; element.setAttribute(key, value));
    return element;
  }

  function textNode(svg, value, x, y, className, anchor = &#x27;start&#x27;) {
    const label = node(&#x27;text&#x27;, {x, y, class: className, &#x27;text-anchor&#x27;: anchor});
    label.textContent = value;
    svg.appendChild(label);
  }

  function regularVertices(count, angle = 0) {
    return Array.from({length: count}, (_, k) =&gt; ({x: Math.cos(angle + k * TAU / count), y: Math.sin(angle + k * TAU / count)}));
  }

  function outerFrameForAxis(count, axisClass = &#x27;vertex&#x27;) {
    // Odd polygons use their vertex-edge mirror line on x. For even polygons,
    // vertex-axis optima use x and edge-midpoint optima use y, making the two
    // dihedral axis classes visually distinct.
    const sharedAxisAngle = count % 2 === 0 &amp;&amp; axisClass === &#x27;edge&#x27; ? Math.PI / 2 : 0;
    const vertexPhase = count % 2 === 1
      ? -Math.PI / count
      : axisClass === &#x27;edge&#x27; ? sharedAxisAngle - Math.PI / count : 0;
    const vertices = regularVertices(count, vertexPhase);
    const facets = vertices.map((a, index) =&gt; {
      const b = vertices[(index + 1) % count];
      const normalAngle = vertexPhase + (index + 0.5) * TAU / count;
      return {a, b, normal: {x: Math.cos(normalAngle), y: Math.sin(normalAngle)}};
    });
    return {vertices, facets, vertexPhase, sharedAxisAngle, axisClass: count % 2 === 0 ? axisClass : &#x27;vertex-edge&#x27;};
  }

  function convexHull(points) {
    const coordinateTolerance = 1e-10;
    const xRepresentatives = new Map(), yRepresentatives = new Map();
    const mergeNearby = (value, representatives) =&gt; {
      const key = Math.round(value / coordinateTolerance);
      for (let offset = -1; offset &lt;= 1; offset++) {
        const representative = representatives.get(key + offset);
        if (representative !== undefined &amp;&amp; Math.abs(representative - value) &lt;= coordinateTolerance) return representative;
      }
      representatives.set(key, value);
      return value;
    };
    const canonical = points.map(p =&gt; ({
      x: mergeNearby(p.x, xRepresentatives),
      y: mergeNearby(p.y, yRepresentatives)
    }));
    const unique = [...new Map(canonical.map(p =&gt; [`${p.x},${p.y}`, p])).values()].sort((a, b) =&gt; a.x - b.x || a.y - b.y);
    if (unique.length &lt;= 2) return unique;
    const turn = (o, a, b) =&gt; cross(sub(a, o), sub(b, o));
    const lower = [];
    for (const p of unique) {
      while (lower.length &gt;= 2 &amp;&amp; turn(lower.at(-2), lower.at(-1), p) &lt;= 1e-12) lower.pop();
      lower.push(p);
    }
    const upper = [];
    for (let i = unique.length - 1; i &gt;= 0; i--) {
      const p = unique[i];
      while (upper.length &gt;= 2 &amp;&amp; turn(upper.at(-2), upper.at(-1), p) &lt;= 1e-12) upper.pop();
      upper.push(p);
    }
    lower.pop();
    upper.pop();
    return lower.concat(upper);
  }

  function solve3(rows, rhs) {
    const a = rows.map((row, i) =&gt; [...row, rhs[i]]);
    for (let col = 0; col &lt; 3; col++) {
      let pivot = col;
      for (let r = col + 1; r &lt; 3; r++) if (Math.abs(a[r][col]) &gt; Math.abs(a[pivot][col])) pivot = r;
      if (Math.abs(a[pivot][col]) &lt; 1e-11) return null;
      [a[col], a[pivot]] = [a[pivot], a[col]];
      const divisor = a[col][col];
      for (let c = col; c &lt; 4; c++) a[col][c] /= divisor;
      for (let r = 0; r &lt; 3; r++) {
        if (r === col) continue;
        const factor = a[r][col];
        for (let c = col; c &lt; 4; c++) a[r][c] -= factor * a[col][c];
      }
    }
    return [a[0][3], a[1][3], a[2][3]];
  }

  function fitAtVertexPhase(vertexPhase) {
    const vertices = regularVertices(innerSides, vertexPhase);
    const support = normals.map(n =&gt; Math.max(...vertices.map(p =&gt; dot(n, p))));
    let best = null;
    for (let i = 0; i &lt; outerSides - 2; i++) for (let j = i + 1; j &lt; outerSides - 1; j++) for (let k = j + 1; k &lt; outerSides; k++) {
      const ids = [i, j, k];
      const solution = solve3(ids.map(q =&gt; [normals[q].x, normals[q].y, support[q]]), [apothem, apothem, apothem]);
      if (!solution || solution[2] &lt; 0) continue;
      const [cx, cy, size] = solution;
      const feasible = normals.every((n, q) =&gt; n.x * cx + n.y * cy + support[q] * size &lt;= apothem + 2e-9);
      if (feasible &amp;&amp; (!best || size &gt; best.size)) best = {cx, cy, size};
    }
    if (!best) return {vertexPhase, cx: 0, cy: 0, size: 0, polygon: [], centeredBySymmetry: false};
    let centeredBySymmetry = false;
    if (gcd(innerSides, outerSides) &gt; 1) {
      const centeredSize = Math.min(...support.map(value =&gt; apothem / value));
      if (Math.abs(centeredSize - best.size) &lt;= 2e-8 * Math.max(1, best.size)) {
        best = {cx: 0, cy: 0, size: centeredSize};
        centeredBySymmetry = true;
      }
    }
    const mirror = nearestMirrorAxes(vertexPhase);
    if (mirror.gap &lt;= 2e-10) {
      const axis = {x: Math.cos(mirror.outerAngle), y: Math.sin(mirror.outerAngle)};
      const axialCenter = scalePoint(dot({x: best.cx, y: best.cy}, axis), axis);
      const axialFeasible = normals.every((n, q) =&gt;
        dot(n, axialCenter) + support[q] * best.size &lt;= apothem + 2e-9
      );
      if (axialFeasible) best = {...best, cx: axialCenter.x, cy: axialCenter.y};
    }
    const polygon = vertices.map(p =&gt; ({x: best.cx + best.size * p.x, y: best.cy + best.size * p.y}));
    return {...best, vertexPhase, polygon, centeredBySymmetry};
  }

  function fitAt(phi) {
    return {...fitAtVertexPhase(innerReferencePhase + phi), phi};
  }

  function selectInnerReference(sharedAxisAngle) {
    const vertexFit = fitAtVertexPhase(sharedAxisAngle);
    const edgePhase = Math.PI / innerSides;
    const edgeFit = fitAtVertexPhase(sharedAxisAngle + edgePhase);
    const tolerance = 2e-9 * Math.max(1, vertexFit.size, edgeFit.size);
    if (edgeFit.size &lt;= vertexFit.size + tolerance) return {phase: 0, phi: sharedAxisAngle, size: vertexFit.size, axisClass: &#x27;vertex&#x27;};
    // For odd n, rotating the vertex-based reference ray by π produces
    // the edge-based placement modulo the polygon&#x27;s 2π/n rotational symmetry.
    if (innerSides % 2 === 1) return {phase: 0, phi: mod(sharedAxisAngle + Math.PI, TAU), size: edgeFit.size, axisClass: &#x27;vertex-edge-reversed&#x27;};
    return {phase: edgePhase, phi: sharedAxisAngle, size: edgeFit.size, axisClass: &#x27;edge&#x27;};
  }

  function lineAngleDistance(a, b) {
    return Math.abs(Math.atan2(Math.sin(2 * (a - b)), Math.cos(2 * (a - b)))) / 2;
  }

  function nearestMirrorAxes(vertexPhase) {
    let nearest = null;
    for (let i = 0; i &lt; innerSides; i++) {
      const innerAngle = vertexPhase + i * Math.PI / innerSides;
      for (let j = 0; j &lt; outerSides; j++) {
        const outerAngle = j * Math.PI / outerSides;
        const gap = lineAngleDistance(innerAngle, outerAngle);
        const canonicalGap = lineAngleDistance(outerAngle, outerFrame.sharedAxisAngle ?? 0);
        if (!nearest || gap &lt; nearest.gap - 1e-12 || (Math.abs(gap - nearest.gap) &lt;= 1e-12 &amp;&amp; canonicalGap &lt; nearest.canonicalGap - 1e-12)) {
          nearest = {innerAngle, outerAngle, gap, canonicalGap};
        }
      }
    }
    return nearest;
  }

  function enumerateCages() {
    const result = [];
    for (let i = 0; i &lt; outerSides; i++) for (let j = i + 1; j &lt; outerSides; j++) {
      if (Math.abs(cross(normals[i], normals[j])) &lt; 1e-10 &amp;&amp; dot(normals[i], normals[j]) &lt; 0) {
        result.push({support: [i, j], weights: [1 / (2 * apothem), 1 / (2 * apothem)]});
      }
    }
    for (let i = 0; i &lt; outerSides - 2; i++) for (let j = i + 1; j &lt; outerSides - 1; j++) for (let k = j + 1; k &lt; outerSides; k++) {
      let raw = [cross(normals[j], normals[k]), cross(normals[k], normals[i]), cross(normals[i], normals[j])];
      if (raw.every(x =&gt; x &lt; -1e-10)) raw = raw.map(x =&gt; -x);
      if (!raw.every(x =&gt; x &gt; 1e-10)) continue;
      const denominator = apothem * raw.reduce((a, b) =&gt; a + b, 0);
      result.push({support: [i, j, k], weights: raw.map(x =&gt; x / denominator)});
    }
    return result;
  }

  function lMap(normal, point) {
    return {x: dot(normal, point), y: cross(point, normal)};
  }

  function buildCertificate() {
    const inner = regularVertices(innerSides, innerReferencePhase);
    const points = [];
    cages.forEach(cage =&gt; {
      let sumHull = [{x: 0, y: 0}];
      cage.support.forEach((facet, q) =&gt; {
        const summand = inner.map(p =&gt; scalePoint(cage.weights[q], lMap(normals[facet], p)));
        sumHull = convexHull(sumHull.flatMap(a =&gt; summand.map(b =&gt; add(a, b))));
      });
      points.push(...sumHull);
    });
    return convexHull(points);
  }

  function activePatterns(phi) {
    const direction = {x: Math.cos(phi), y: Math.sin(phi)};
    const inner = regularVertices(innerSides, innerReferencePhase);
    let best = -Infinity;
    const cageRows = [];
    cages.forEach((cage, cageIndex) =&gt; {
      const choicesByFacet = cage.support.map((facet, q) =&gt; {
        const choices = inner.map((p, vertex) =&gt; {
          const vector = scalePoint(cage.weights[q], lMap(normals[facet], p));
          return {facet, vertex, vector, weight: cage.weights[q], score: dot(direction, vector)};
        });
        const maximum = Math.max(...choices.map(choice =&gt; choice.score));
        return choices.filter(choice =&gt; maximum - choice.score &lt;= 1e-10);
      });
      const value = choicesByFacet.reduce((sum, choices) =&gt; sum + choices[0].score, 0);
      best = Math.max(best, value);
      cageRows.push({cageIndex, cage, choicesByFacet, value});
    });
    const patterns = [];
    cageRows.filter(row =&gt; best - row.value &lt;= 1e-9).forEach(row =&gt; {
      const expand = (index, contributions) =&gt; {
        if (index === row.choicesByFacet.length) {
          const point = contributions.reduce((sum, item) =&gt; add(sum, item.vector), {x: 0, y: 0});
          patterns.push({cageIndex: row.cageIndex, cage: row.cage, contributions: [...contributions], point, value: row.value});
          return;
        }
        row.choicesByFacet[index].forEach(choice =&gt; expand(index + 1, [...contributions, choice]));
      };
      expand(0, []);
    });
    return patterns.filter((pattern, i) =&gt; patterns.findIndex(other =&gt;
      other.cageIndex === pattern.cageIndex &amp;&amp;
      other.contributions.map(item =&gt; item.vertex).join(&#x27;,&#x27;) === pattern.contributions.map(item =&gt; item.vertex).join(&#x27;,&#x27;)
    ) === i);
  }

  function closestCertificateEdges() {
    let minimum = Infinity;
    const rows = certificateHull.map((u, i) =&gt; {
      const v = certificateHull[(i + 1) % certificateHull.length];
      const d = sub(v, u);
      const lengthSquared = dot(d, d);
      const t = lengthSquared &lt;= 1e-20 ? 0 : Math.max(0, Math.min(1, -dot(u, d) / lengthSquared));
      const closestPoint = add(u, scalePoint(t, d));
      const distance = Math.hypot(closestPoint.x, closestPoint.y);
      minimum = Math.min(minimum, distance);
      return {i, u, v, t, closestPoint, distance};
    });
    return rows.filter(row =&gt; Math.abs(row.distance - minimum) &lt;= 1e-8);
  }

  function outwardNormal(edge) {
    if (edge.distance &gt; 1e-12) return scalePoint(1 / edge.distance, edge.closestPoint);
    const d = sub(edge.v, edge.u);
    let n = {x: d.y, y: -d.x};
    n = scalePoint(1 / Math.hypot(n.x, n.y), n);
    return dot(n, edge.u) &lt; 0 ? scalePoint(-1, n) : n;
  }

  function pointsAttribute(points, map) {
    return points.map(p =&gt; `${map.x(p.x)},${map.y(p.y)}`).join(&#x27; &#x27;);
  }

  function setupSvg(svg, ratio = 1) {
    const width = Math.max(260, Math.round(svg.getBoundingClientRect().width || 320));
    const height = Math.round(width / ratio);
    svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`);
    svg.replaceChildren();
    svg.appendChild(node(&#x27;rect&#x27;, {x: 16, y: 16, width: width - 32, height: height - 32, class: &#x27;cgi-frame&#x27;}));
    return {width, height};
  }

  function chainLayout(vectors, box) {
    const points = [{x: 0, y: 0}];
    vectors.forEach(vector =&gt; points.push(add(points.at(-1), vector)));
    const xs = points.map(p =&gt; p.x);
    const ys = points.map(p =&gt; p.y);
    const minX = Math.min(...xs);
    const maxX = Math.max(...xs);
    const minY = Math.min(...ys);
    const maxY = Math.max(...ys);
    const rangeX = Math.max(1e-9, maxX - minX);
    const rangeY = Math.max(1e-9, maxY - minY);
    const factor = Math.min((box.width - 72) / rangeX, (box.height - 48) / rangeY);
    const centerX = (minX + maxX) / 2;
    const centerY = (minY + maxY) / 2;
    return points.map(p =&gt; ({x: box.width / 2 + factor * (p.x - centerX), y: box.height / 2 - factor * (p.y - centerY)}));
  }

  function tightSideMap(fit) {
    const facets = normals.map((normal, facet) =&gt; {
      const support = Math.max(...fit.polygon.map(point =&gt; dot(normal, point)));
      return Math.abs(support - apothem) &lt;= 3e-7 ? facet : null;
    }).filter(facet =&gt; facet !== null);
    return new Map(facets.map(facet =&gt; [facet, facet + 1]));
  }

  function selectWorkedPattern(patterns) {
    const legibility = pattern =&gt; {
      const weights = pattern.contributions.map(item =&gt; item.weight);
      return Math.min(...weights) / Math.max(...weights);
    };
    const key = pattern =&gt; `${pattern.cageIndex}:${pattern.contributions.map(item =&gt; item.facet).join(&#x27;,&#x27;)}:${pattern.contributions.map(item =&gt; item.vertex).join(&#x27;,&#x27;)}`;
    return [...patterns].sort((a, b) =&gt;
      Number(b.contributions.length === 3) - Number(a.contributions.length === 3)
      || legibility(b) - legibility(a)
      || key(a).localeCompare(key(b))
    )[0] ?? null;
  }

  function endpointKey(point) {
    const clean = value =&gt; Math.abs(value) &lt;= 5e-12 ? 0 : value;
    return `${clean(point.x).toFixed(10)},${clean(point.y).toFixed(10)}`;
  }

  function cageKey(pattern) {
    return pattern.cage.support.join(&#x27;,&#x27;);
  }

  function activeCageView(patterns, phi) {
    const endpointGroups = [];
    patterns.forEach(pattern =&gt; {
      const tolerance = 1e-9 * Math.max(1, Math.hypot(pattern.point.x, pattern.point.y));
      let group = endpointGroups.find(candidate =&gt; Math.hypot(
        candidate.point.x - pattern.point.x,
        candidate.point.y - pattern.point.y
      ) &lt;= tolerance);
      if (!group) {
        group = {point: pattern.point, patterns: []};
        endpointGroups.push(group);
      }
      group.patterns.push(pattern);
    });

    const tangent = {x: -Math.sin(phi), y: Math.cos(phi)};
    const groups = endpointGroups.map(group =&gt; {
      const byCage = new Map();
      group.patterns.forEach(pattern =&gt; {
        const key = cageKey(pattern);
        if (!byCage.has(key)) byCage.set(key, []);
        byCage.get(key).push(pattern);
      });
      const cages = [...byCage.entries()].map(([key, members]) =&gt; ({
        key,
        pattern: selectWorkedPattern(members),
        constructionCount: members.length
      })).sort((a, b) =&gt; a.key.localeCompare(b.key, undefined, {numeric: true}));
      return {
        key: endpointKey(group.point),
        point: group.point,
        value: group.patterns[0].value,
        patterns: group.patterns,
        constructionCount: group.patterns.length,
        cages
      };
    }).sort((a, b) =&gt;
      dot(tangent, a.point) - dot(tangent, b.point)
      || a.point.x - b.point.x
      || a.point.y - b.point.y
    );

    const items = groups.map((group, groupIndex) =&gt; {
      group.index = groupIndex;
      const pattern = selectWorkedPattern(group.patterns);
      return {
        key: cageKey(pattern),
        pattern,
        group,
        groupIndex,
        itemKey: group.key
      };
    });
    const teachingPattern = selectWorkedPattern(items.map(item =&gt; item.pattern));

  function teachingDefaultIndex(items) {
    const pattern = selectWorkedPattern(items.map(item =&gt; item.pattern));

    return Math.max(0, index);

  function seriesClass(number) {

  function drawPhysical(fit, sideMap, isGlobal, workedPattern) {

    const outer = outerFrame.vertices;

      physicalSvg.appendChild(node(&#x27;line&#x27;, {x1: map.x(a.x), y1: map.y(a.y), x2: map.x(b.x), y2: map.y(b.y), class: `cgi-active-side ${seriesClass(number)}`}));

      x1: map.x(fit.cx), y1: map.y(fit.cy), x2: map.x(rayTip.x), y2: map.y(rayTip.y), class: &#x27;cgi-symmetry-ray&#x27;

    const contactFeatures = new Set();
    const contactMarkers = new Map();
    sideMap.forEach((number, facet) =&gt; {
      const n = normals[facet];
      const values = fit.polygon.map(p =&gt; dot(n, p));
      const maximum = Math.max(...values);
      const contactPoints = fit.polygon.filter((p, i) =&gt; maximum - values[i] &lt;= 2e-7);
      if (!contactPoints.length) return;

        class: `cgi-active-side ${seriesClass(number)}`

      const center = contactPoints.reduce((sum, p) =&gt; add(sum, p), {x: 0, y: 0});
      center.x /= contactPoints.length;
      center.y /= contactPoints.length;
      physicalSvg.appendChild(node(&#x27;line&#x27;, {x1: map.x(center.x), y1: map.y(center.y), x2: map.x(center.x + 0.14 * n.x), y2: map.y(center.y + 0.14 * n.y), class: `cgi-vector cgi-contact-normal ${seriesClass(number)}`}));
      contactPoints.forEach(p =&gt; contactMarkers.set(`${p.x.toPrecision(9)},${p.y.toPrecision(9)}`, p));
      const {a, b} = outerFrame.facets[facet];
      const sideMidpoint = scalePoint(0.5, add(a, b));

      physicalSvg.appendChild(node(&#x27;circle&#x27;, {cx: map.x(badgePoint.x), cy: map.y(badgePoint.y), r: 9, class: `cgi-side-badge ${seriesClass(number)}`}));
      textNode(physicalSvg, String(number), map.x(badgePoint.x), map.y(badgePoint.y), `cgi-side-number ${seriesClass(number)}`, &#x27;middle&#x27;);

    }));
    physicalSvg.appendChild(node(&#x27;circle&#x27;, {cx: map.x(0), cy: map.y(0), r: 5.5, class: &#x27;cgi-center-outer&#x27;}));
    physicalSvg.appendChild(node(&#x27;circle&#x27;, {cx: map.x(fit.cx), cy: map.y(fit.cy), r: 4, class: &#x27;cgi-center-inner&#x27;}));
    if (centerDistance &lt;= 2e-7 &amp;&amp; isGlobal) physicalSvg.appendChild(node(&#x27;circle&#x27;, {cx: map.x(0), cy: map.y(0), r: 9, class: &#x27;cgi-center-halo&#x27;}));
    const referenceAxisAligned = lineAngleDistance(fit.phi, outerFrame.sharedAxisAngle) &lt;= 0.0025
      &amp;&amp; Math.abs(cross({x: fit.cx, y: fit.cy}, sharedAxis)) &lt;= 0.003;
    return {mirror, mirrorAligned, mirrorOffset, referenceAxisAligned, centerDistance, showMirror, contactFeatureCount: contactFeatures.size};
  }

  function chainIntoBox(vectors, x, y, width, height) {
    const points = [{x: 0, y: 0}];
    vectors.forEach(vector =&gt; points.push(add(points.at(-1), vector)));
    const xs = points.map(p =&gt; p.x);
    const ys = points.map(p =&gt; p.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const factor = Math.min(width / Math.max(1e-9, maxX - minX), height / Math.max(1e-9, maxY - minY));
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    return points.map(p =&gt; ({x: x + width / 2 + factor * (p.x - cx), y: y + height / 2 - factor * (p.y - cy)}));
  }

  function pointSegmentDistance(point, a, b) {
    const segment = sub(b, a);
    const lengthSquared = dot(segment, segment);
    if (lengthSquared &lt;= 1e-12) return Math.hypot(point.x - a.x, point.y - a.y);
    const t = Math.max(0, Math.min(1, dot(sub(point, a), segment) / lengthSquared));
    const nearest = add(a, scalePoint(t, segment));
    return Math.hypot(point.x - nearest.x, point.y - nearest.y);
  }

  function separatedBadgePositions(chain, bounds, extraSegments = []) {
    const segments = chain.slice(0, -1).map((point, i) =&gt; ({a: point, b: chain[i + 1]}));
    const centroid = chain.reduce((sum, point) =&gt; add(sum, point), {x: 0, y: 0});
    centroid.x /= chain.length;
    centroid.y /= chain.length;
    const placed = [];
    const withinBounds = point =&gt; point.x &gt;= bounds.left &amp;&amp; point.x &lt;= bounds.right &amp;&amp; point.y &gt;= bounds.top &amp;&amp; point.y &lt;= bounds.bottom;
    const candidateClearance = point =&gt; Math.min(
      ...segments.concat(extraSegments).map(segment =&gt; pointSegmentDistance(point, segment.a, segment.b) - 12.5),
      ...chain.map(marker =&gt; Math.hypot(point.x - marker.x, point.y - marker.y) - 15),
      ...(placed.length ? placed.map(other =&gt; Math.hypot(point.x - other.x, point.y - other.y) - 19) : [Infinity])
    );
    const canonicalNormal = segment =&gt; {
      const direction = sub(segment.b, segment.a);
      const length = Math.max(1e-9, Math.hypot(direction.x, direction.y));
      let normal = {x: -direction.y / length, y: direction.x / length};
      if (normal.y &gt; 1e-9 || (Math.abs(normal.y) &lt;= 1e-9 &amp;&amp; normal.x &lt; 0)) normal = scalePoint(-1, normal);
      return normal;
    };
    const result = segments.map(segment =&gt; {
      const normal = canonicalNormal(segment);
      const midpoint = add(segment.a, scalePoint(0.5, sub(segment.b, segment.a)));
      const outwardSign = dot(normal, sub(midpoint, centroid)) &gt;= 0 ? 1 : -1;
      const candidates = [];
      [14, -14, 22, -22, 31, -31].forEach(lane =&gt; {
        const signedLane = lane * outwardSign;
        [0.5, 0.38, 0.62, 0.25, 0.75].forEach(t =&gt; {
          const base = add(segment.a, scalePoint(t, sub(segment.b, segment.a)));
          const point = add(base, scalePoint(signedLane, normal));
          if (withinBounds(point)) candidates.push({base, point, clearance: candidateClearance(point)});
        });
      });
      const chosen = candidates.find(candidate =&gt; candidate.clearance &gt;= 0)
        ?? candidates.sort((a, b) =&gt; b.clearance - a.clearance)[0]
        ?? {base: midpoint, point: midpoint};
      placed.push(chosen.point);
      return {base: chosen.base, point: chosen.point};
    });
    return result;
  }

  function drawBridge(pattern, sideMap, generatorNumber) {
    const width = Math.max(260, Math.round(bridgeSvg.getBoundingClientRect().width || 340));

    bridgeSvg.style.aspectRatio = `${width} / ${height}`;
    bridgeSvg.replaceChildren();

    const defs = node(&#x27;defs&#x27;);
    const vectorMarker = node(&#x27;marker&#x27;, {id: &#x27;cgi-vector-arrow&#x27;, viewBox: &#x27;0 0 6 6&#x27;, refX: 5.2, refY: 3, markerWidth: 5, markerHeight: 5, orient: &#x27;auto&#x27;});
    vectorMarker.appendChild(node(&#x27;path&#x27;, {d: &#x27;M0,0 L6,3 L0,6 Z&#x27;, class: &#x27;cgi-arrowhead&#x27;}));
    const resultMarker = node(&#x27;marker&#x27;, {id: &#x27;cgi-result-arrow&#x27;, viewBox: &#x27;0 0 6 6&#x27;, refX: 5.2, refY: 3, markerWidth: 5, markerHeight: 5, orient: &#x27;auto&#x27;});

    bridgeSvg.appendChild(defs);
    bridgeSvg.appendChild(node(&#x27;rect&#x27;, {x: 16, y: 16, width: width - 32, height: height - 32, class: &#x27;cgi-frame&#x27;}));

    if (!pattern) return {sideNumbers: [], contributionCount: 0};

    const rotations = pattern.contributions.map((_, offset) =&gt; [
      ...pattern.contributions.slice(offset), ...pattern.contributions.slice(0, offset)
    ]);
    const contributions = rotations.sort((a, b) =&gt; {
      const startX = items =&gt; chainIntoBox(items.map(item =&gt; scalePoint(item.weight, normals[item.facet])), 0, 0, 100, 100)[0].x;
      return startX(a) - startX(b);
    })[0];
    const generatorLabel = `g${subscriptNumber(generatorNumber)}`;
    const sideNumbers = contributions.map(item =&gt; sideMap.get(item.facet) ?? item.facet + 1);
    const normalEquation = sideNumbers.map(number =&gt; `λ${subscriptNumber(number)}n${subscriptNumber(number)}`).join(&#x27; + &#x27;) + &#x27; = 0&#x27;;

        }));

        const length = Math.hypot(displacement.x, displacement.y);

      });
      badges.forEach((badge, i) =&gt; bridgeSvg.appendChild(node(&#x27;circle&#x27;, {
        cx: badge.point.x, cy: badge.point.y, r: 9,
        class: `cgi-contribution-badge ${seriesClass(sideNumbers[i])}`
      })));
      badges.forEach((badge, i) =&gt; textNode(
        bridgeSvg, String(sideNumbers[i]), badge.point.x, badge.point.y,

      ));
    };

    textNode(bridgeSvg, &#x27;STEP 1 · CLOSE THE NORMAL LOOP&#x27;, 28, 36, &#x27;cgi-step-title&#x27;);
    textNode(bridgeSvg, &#x27;Copy the numbered arrows from Panel 1.&#x27;, 28, 54, &#x27;cgi-step-note&#x27;);
    textNode(bridgeSvg, &#x27;Slide them head-to-tail without rotating.&#x27;, 28, 70, &#x27;cgi-step-note&#x27;);
    textNode(bridgeSvg, normalEquation, width / 2, 88, &#x27;cgi-step-equation&#x27;, &#x27;middle&#x27;);

    const weightedNormals = contributions.map(item =&gt; scalePoint(item.weight, normals[item.facet]));
    const topChain = chainIntoBox(weightedNormals, 42, 108, width - 84, dividerY - 208);
    if (Math.hypot(topChain.at(-1).x - topChain[0].x, topChain.at(-1).y - topChain[0].y) &lt;= 0.5) topChain[topChain.length - 1] = {...topChain[0]};
    const closure = topChain[0];
    bridgeSvg.appendChild(node(&#x27;circle&#x27;, {cx: closure.x, cy: closure.y, r: 9, class: &#x27;cgi-balance-halo&#x27;}));
    addNumberedChain(topChain, {left: 25, right: width - 25, top: 104, bottom: dividerY - 82});
    textNode(bridgeSvg, &#x27;circled point: start = finish = 0&#x27;, width / 2, dividerY - 62, &#x27;cgi-balance-label&#x27;, &#x27;middle&#x27;);
    textNode(bridgeSvg, &#x27;No escape translation:&#x27;, width / 2, dividerY - 36, &#x27;cgi-balance-label&#x27;, &#x27;middle&#x27;);
    textNode(bridgeSvg, &#x27;loosening one chosen side tightens another.&#x27;, width / 2, dividerY - 18, &#x27;cgi-balance-label&#x27;, &#x27;middle&#x27;);

    bridgeSvg.appendChild(node(&#x27;line&#x27;, {x1: 28, y1: dividerY, x2: width / 2 - 73, y2: dividerY, class: &#x27;cgi-bridge-divider&#x27;}));
    bridgeSvg.appendChild(node(&#x27;line&#x27;, {x1: width / 2 + 73, y1: dividerY, x2: width - 28, y2: dividerY, class: &#x27;cgi-bridge-divider&#x27;}));
    textNode(bridgeSvg, &#x27;↓  keep the same λ’s&#x27;, width / 2, dividerY + 4, &#x27;cgi-same-weights&#x27;, &#x27;middle&#x27;);

    textNode(bridgeSvg, `STEP 2 · BUILD ${generatorLabel}`, 28, dividerY + 34, &#x27;cgi-step-title&#x27;);
    textNode(bridgeSvg, &#x27;Keep each λ; replace its normal arrow&#x27;, 28, dividerY + 52, &#x27;cgi-step-note&#x27;);
    textNode(bridgeSvg, &#x27;with the matching certificate contribution.&#x27;, 28, dividerY + 68, &#x27;cgi-step-note&#x27;);
    textNode(bridgeSvg, `${generatorLabel} = Σ λⱼLₙⱼ(pⱼ)`, width / 2, dividerY + 86, &#x27;cgi-step-equation&#x27;, &#x27;middle&#x27;);

    const certificateVectors = contributions.map(item =&gt; item.vector);
    const bottomTop = dividerY + 106;
    const bottomChain = chainIntoBox(certificateVectors, 42, bottomTop, width - 84, height - bottomTop - 58);
    const resultSegment = {a: bottomChain[0], b: bottomChain.at(-1)};
    bridgeSvg.appendChild(node(&#x27;line&#x27;, {
      x1: resultSegment.a.x, y1: resultSegment.a.y, x2: resultSegment.b.x, y2: resultSegment.b.y,
      class: &#x27;cgi-resultant&#x27;, &#x27;marker-end&#x27;: &#x27;url(#cgi-result-arrow)&#x27;
    }));
    addNumberedChain(bottomChain, {left: 25, right: width - 25, top: bottomTop - 2, bottom: height - 50}, [resultSegment]);
    bridgeSvg.appendChild(node(&#x27;circle&#x27;, {cx: bottomChain[0].x, cy: bottomChain[0].y, r: 5, class: &#x27;cgi-balance-zero&#x27;}));
    const endpoint = bottomChain.at(-1);
    bridgeSvg.appendChild(node(&#x27;circle&#x27;, {cx: endpoint.x, cy: endpoint.y, r: 6, class: &#x27;cgi-current-point&#x27;}));
    const legendY = height - 24;
    bridgeSvg.appendChild(node(&#x27;circle&#x27;, {cx: width / 2 - 92, cy: legendY - 4, r: 4, class: &#x27;cgi-balance-zero&#x27;}));
    textNode(bridgeSvg, &#x27;start 0&#x27;, width / 2 - 83, legendY, &#x27;cgi-step-note&#x27;);
    bridgeSvg.appendChild(node(&#x27;circle&#x27;, {cx: width / 2 + 17, cy: legendY - 4, r: 5, class: &#x27;cgi-current-point&#x27;}));
    textNode(bridgeSvg, `endpoint ${generatorLabel}`, width / 2 + 27, legendY, &#x27;cgi-result-label&#x27;);

    return {sideNumbers, contributionCount: contributions.length};
  }

  function drawCertificate(phi, groups, selectedGroupIndex, isGlobal) {
    const box = setupSvg(certificateSvg);
    const defs = node(&#x27;defs&#x27;);

    const globalLabelPoint = scalePoint(globalDistance + 0.16 * extent, globalLabelDirection);
    const globalLabelX = Math.max(55, Math.min(box.width - 55, map.x(globalLabelPoint.x)));
    const globalLabelY = Math.max(26, Math.min(box.height - 26, map.y(globalLabelPoint.y)));
    certificateSvg.appendChild(node(&#x27;line&#x27;, {
      x1: map.x(globalCirclePoint.x), y1: map.y(globalCirclePoint.y),
      x2: globalLabelX, y2: globalLabelY,
      class: &#x27;cgi-global-guide&#x27;
    }));
    textNode(
      certificateSvg,
      &#x27;global radius d*&#x27;,
      globalLabelX,
      globalLabelY - 4,
      &#x27;cgi-global-label&#x27;,
      &#x27;middle&#x27;
    );
    certificateHull.forEach(p =&gt; certificateSvg.appendChild(node(&#x27;circle&#x27;, {cx: map.x(p.x), cy: map.y(p.y), r: 2, class: &#x27;cgi-cert-point&#x27;})));
    closestEdges.forEach(edge =&gt; certificateSvg.appendChild(node(&#x27;line&#x27;, {x1: map.x(edge.u.x), y1: map.y(edge.u.y), x2: map.x(edge.v.x), y2: map.y(edge.v.y), class: &#x27;cgi-closest&#x27;})));
    const direction = {x: Math.cos(phi), y: Math.sin(phi)};
    const distance = groups[0].value;

    const supportLabelPoint = add(scalePoint(distance, direction), scalePoint(0.58 * extent, tangent));
    const supportLabelX = Math.max(48, Math.min(box.width - 48, map.x(supportLabelPoint.x)));
    const supportLabelY = Math.max(30, Math.min(box.height - 30, map.y(supportLabelPoint.y) - 6));
    textNode(certificateSvg, isGlobal ? &#x27;current = global&#x27; : &#x27;current support&#x27;, supportLabelX, supportLabelY, &#x27;cgi-current-label&#x27;, &#x27;middle&#x27;);
    certificateSvg.appendChild(node(&#x27;line&#x27;, {x1: map.x(0), y1: map.y(0), x2: map.x(distance * direction.x), y2: map.y(distance * direction.y), class: &#x27;cgi-distance-line&#x27;}));
    certificateSvg.appendChild(node(&#x27;circle&#x27;, {cx: map.x(0), cy: map.y(0), r: 3, class: &#x27;cgi-origin&#x27;}));
    const exposedPoints = groups.map(group =&gt; group.point);
    if (exposedPoints.length &gt; 1) {
      const ordered = [...exposedPoints].sort((a, b) =&gt; dot(tangent, a) - dot(tangent, b));
      certificateSvg.appendChild(node(&#x27;line&#x27;, {x1: map.x(ordered[0].x), y1: map.y(ordered[0].y), x2: map.x(ordered.at(-1).x), y2: map.y(ordered.at(-1).y), class: &#x27;cgi-exposed&#x27;}));
    }
    const workedPoint = exposedPoints[selectedGroupIndex];
    const supportFoot = scalePoint(distance, direction);
    if (workedPoint) {
      certificateSvg.appendChild(node(&#x27;line&#x27;, {x1: map.x(0), y1: map.y(0), x2: map.x(workedPoint.x), y2: map.y(workedPoint.y), class: &#x27;cgi-resultant&#x27;}));
      certificateSvg.appendChild(node(&#x27;line&#x27;, {x1: map.x(workedPoint.x), y1: map.y(workedPoint.y), x2: map.x(supportFoot.x), y2: map.y(supportFoot.y), class: &#x27;cgi-projection-guide&#x27;}));
      certificateSvg.appendChild(node(&#x27;circle&#x27;, {cx: map.x(workedPoint.x), cy: map.y(workedPoint.y), r: 10, class: &#x27;cgi-worked-point-halo&#x27;}));
    }
    const screenNormal = {x: direction.x, y: -direction.y};
    exposedPoints.forEach((point, i) =&gt; {
      const px = map.x(point.x), py = map.y(point.y);
      certificateSvg.appendChild(node(&#x27;circle&#x27;, {cx: px, cy: py, r: i === selectedGroupIndex ? 7 : i &lt; 6 ? 5 : 3, class: &#x27;cgi-current-point&#x27;}));
      if (i &gt;= 6 &amp;&amp; i !== selectedGroupIndex) return;
      const sign = i % 2 === 0 ? 1 : -1;
      const offset = 14 + 5 * Math.floor(i / 2);
      const labelX = Math.max(28, Math.min(box.width - 28, px + sign * offset * screenNormal.x));
      const labelY = Math.max(26, Math.min(box.height - 26, py + sign * offset * screenNormal.y));

    textNode(certificateSvg, isGlobal ? &#x27;d(φ) = d*&#x27; : &#x27;d(φ)&#x27;, map.x(distance * direction.x / 2) + 7, map.y(distance * direction.y / 2) - 7, &#x27;cgi-current-label&#x27;);
    return distance;
  }

  function configure() {
    currentCageItems = [];
    selectedCageItemKey = null;
    selectedCageKey = null;
    innerSides = Math.max(3, Math.min(20, Math.round(Number(innerControl.value) || 5)));
    outerSides = Math.max(3, Math.min(20, Math.round(Number(outerControl.value) || 8)));
    innerControl.value = String(innerSides);
    outerControl.value = String(outerSides);
    apothem = Math.cos(Math.PI / outerSides);
    const outerAxisClasses = outerSides % 2 === 0 ? [&#x27;vertex&#x27;, &#x27;edge&#x27;] : [&#x27;vertex-edge&#x27;];
    let selectedFrame = null;
    outerAxisClasses.forEach(axisClass =&gt; {
      const frame = outerFrameForAxis(outerSides, axisClass);
      outerFrame = frame;
      normals = frame.facets.map(facet =&gt; facet.normal);
      const reference = selectInnerReference(frame.sharedAxisAngle);
      const tolerance = 2e-9 * Math.max(1, reference.size, selectedFrame?.reference.size ?? 0);
      if (!selectedFrame || reference.size &gt; selectedFrame.reference.size + tolerance) selectedFrame = {frame, reference};
    });
    outerFrame = selectedFrame.frame;
    normals = outerFrame.facets.map(facet =&gt; facet.normal);
    cages = enumerateCages();
    const reference = selectedFrame.reference;
    innerReferencePhase = reference.phase;
    preferredGlobalPhi = reference.phi;
    certificateHull = buildCertificate();
    closestEdges = closestCertificateEdges();
    globalDistance = activePatterns(preferredGlobalPhi)[0]?.value ?? Infinity;
    globalAngles = closestEdges.map(edge =&gt; {
      const n = outwardNormal(edge);
      return mod(Math.atan2(n.y, n.x), TAU);
    });
    angleControl.value = String(preferredGlobalPhi * 180 / Math.PI);
    draw();
  }

  function draw() {
    if (!certificateHull.length) return;
    const phi = Number(angleControl.value) * Math.PI / 180;
    const fit = fitAt(phi);
    const patterns = activePatterns(phi);
    const currentSupport = patterns[0]?.value ?? Infinity;
    const globalTolerance = 1e-9 * Math.max(1, globalDistance);
    const isGlobal = Math.abs(currentSupport - globalDistance) &lt;= globalTolerance;
    const nearestGlobalGap = Math.min(...globalAngles.map(value =&gt; Math.abs(Math.atan2(Math.sin(phi - value), Math.cos(phi - value)))));
    const isNearGlobal = !isGlobal &amp;&amp; nearestGlobalGap &lt;= 0.003;
    const cageView = activeCageView(patterns, phi);
    let selectedItemIndex = cageView.items.findIndex(item =&gt; item.itemKey === selectedCageItemKey);
    if (selectedItemIndex &lt; 0 &amp;&amp; selectedCageKey !== null) {
      selectedItemIndex = cageView.items.findIndex(item =&gt; item.key === selectedCageKey);
    }
    if (selectedItemIndex &lt; 0) selectedItemIndex = teachingDefaultIndex(cageView.items);
    const selectedItem = cageView.items[selectedItemIndex];
    if (!selectedItem) return;
    currentCageItems = cageView.items;
    selectedCageItemKey = selectedItem.itemKey;
    selectedCageKey = selectedItem.key;
    const selectedGroupIndex = selectedItem.groupIndex;
    const generatorNumber = selectedGroupIndex + 1;
    const workedPattern = selectedItem.pattern;
    const sideMap = tightSideMap(fit);
    const physicalState = drawPhysical(fit, sideMap, isGlobal, workedPattern);
    const bridgeState = drawBridge(workedPattern, sideMap, generatorNumber);
    const distance = drawCertificate(phi, cageView.groups, selectedGroupIndex, isGlobal);
    const scale = 1 / distance;
    angleValue.textContent = `${(phi * 180 / Math.PI).toFixed(2)}°`;
    orientationState.textContent = isGlobal ? &#x27;global optimum&#x27; : isNearGlobal ? &#x27;near optimum—not exact&#x27; : &#x27;not global&#x27;;
    orientationState.dataset.global = String(isGlobal);
    orientationState.dataset.near = String(isNearGlobal);
    const sides = [...sideMap.keys()].map(facet =&gt; facet + 1).join(&#x27;, &#x27;);
    const repeatDegrees = 360 / (innerSides * outerSides / gcd(innerSides, outerSides));
    const sharedOrder = gcd(innerSides, outerSides);
    const mirrorGapDegrees = physicalState.mirror.gap * 180 / Math.PI;
    const centerText = sharedOrder &gt; 1 &amp;&amp; physicalState.centerDistance &lt;= 2e-7 &amp;&amp; isGlobal
      ? `&lt;strong&gt;Centers:&lt;/strong&gt; overlap at a global optimum; gcd(${innerSides}, ${outerSides}) = ${sharedOrder} guarantees a centered representative.`
      : sharedOrder &gt; 1 &amp;&amp; physicalState.centerDistance &lt;= 2e-7
        ? `&lt;strong&gt;Centers:&lt;/strong&gt; overlap for this φ, not the overall best; gcd = ${sharedOrder} guarantees existence, not uniqueness.`
      : sharedOrder &gt; 1
        ? `&lt;strong&gt;Center:&lt;/strong&gt; shared order ${sharedOrder} predicts a centered optimizer; the displayed numerical fit is offset by ${physicalState.centerDistance.toFixed(5)}.`
      : physicalState.centerDistance &lt;= 2e-7
        ? &#x27;&lt;strong&gt;Center:&lt;/strong&gt; coincident here, but not symmetry-forced because gcd = 1.&#x27;
        : `&lt;strong&gt;Center:&lt;/strong&gt; offset by ${physicalState.centerDistance.toFixed(5)}; gcd = 1 gives no centering guarantee.`;
    const sharedAxisName = outerFrame.sharedAxisAngle === 0 ? &#x27;x-axis&#x27; : &#x27;y-axis&#x27;;
    const outerAxisKind = outerFrame.axisClass === &#x27;edge&#x27; ? &#x27;edge-midpoint&#x27; : outerFrame.axisClass === &#x27;vertex&#x27; ? &#x27;vertex-axis&#x27; : &#x27;vertex-edge&#x27;;
    const mirrorText = physicalState.referenceAxisAligned &amp;&amp; isGlobal
      ? `&lt;strong&gt;Symmetry:&lt;/strong&gt; the purple ray lies on the shared ${sharedAxisName} (${outerAxisKind}) at this global optimum.`
      : physicalState.mirrorAligned
        ? &#x27;&lt;strong&gt;Mirrors:&lt;/strong&gt; a shared axis is shown.&#x27;
      : mirrorGapDegrees &lt;= 0.15
        ? `&lt;strong&gt;Mirrors:&lt;/strong&gt; parallel axes, line offset ${physicalState.mirrorOffset.toFixed(5)}.`
        : `&lt;strong&gt;Mirrors:&lt;/strong&gt; nearest axis gap ${mirrorGapDegrees.toFixed(2)}°; an axis is drawn only when they coincide.`;
    symmetryStatus.innerHTML = `${centerText}&lt;br&gt;${mirrorText}`;
    const selectedSides = workedPattern.cage.support.map(facet =&gt; sideMap.get(facet) ?? facet + 1).sort((a, b) =&gt; a - b);
    const workedSides = selectedSides.join(&#x27;, &#x27;);
    const generatorLabel = `g${subscriptNumber(generatorNumber)}`;
    const sharedCageCount = selectedItem.group.cages.length;
    const sharedText = sharedCageCount &gt; 1
      ? ` ${sharedCageCount} active cages build this same endpoint; one representative is shown.`
      : &#x27;&#x27;;
    contactSummary.textContent = `${physicalState.contactFeatureCount} contact location${physicalState.contactFeatureCount === 1 ? &#x27;&#x27; : &#x27;s&#x27;} · ${sideMap.size} tight side${sideMap.size === 1 ? &#x27;&#x27; : &#x27;s&#x27;}${sideMap.size === outerSides ? &#x27; · all outer sides&#x27; : &#x27;&#x27;}`;
    cagePosition.textContent = `Example ${selectedItemIndex + 1} of ${cageView.items.length} · sides ${workedSides} → ${generatorLabel}`;
    generatorSummary.textContent = `${bridgeState.contributionCount} weighted normals close at zero and build ${generatorLabel}.${sharedText}`;
    cagePrevButton.disabled = selectedItemIndex === 0;
    cageNextButton.disabled = selectedItemIndex === cageView.items.length - 1;
    const globalScale = 1 / globalDistance;
    certificateSummary.innerHTML = isGlobal
      ? `Current = global: d(φ) = d* = ${distance.toFixed(6)} → μ* = ${scale.toFixed(6)}&lt;br&gt;Equivalent optima repeat every ${repeatDegrees.toFixed(3)}°.`
      : `Current: d(φ) = ${distance.toFixed(6)} → μ(φ) = ${scale.toFixed(6)}&lt;br&gt;Global: d* = ${globalDistance.toFixed(6)} → μ* = ${globalScale.toFixed(6)}`;
    physicalSvg.setAttribute(&#x27;aria-label&#x27;, `Fixed-orientation fit with ${physicalState.contactFeatureCount} contact features and tight outer sides ${sides}.`);
    bridgeSvg.setAttribute(&#x27;aria-label&#x27;, `Representative active-cage example ${selectedItemIndex + 1} of ${cageView.items.length}, using outer sides ${workedSides}. Its ${bridgeState.contributionCount} positively weighted outward normals close at zero, so translation cancels. The same weights produce certificate point g${generatorNumber}, whose support value is ${distance.toFixed(7)}.`);
    certificateSvg.setAttribute(&#x27;aria-label&#x27;, `Certificate polygon with g${generatorNumber} selected, current support distance ${distance.toFixed(7)}, and global minimum support distance ${globalDistance.toFixed(7)}.`);
  }

  function selectAdjacentCage(delta) {
    const currentIndex = currentCageItems.findIndex(item =&gt; item.itemKey === selectedCageItemKey);
    if (currentIndex &lt; 0) return;
    const nextIndex = Math.max(0, Math.min(currentCageItems.length - 1, currentIndex + delta));
    if (nextIndex === currentIndex) return;
    const nextItem = currentCageItems[nextIndex];
    selectedCageItemKey = nextItem.itemKey;
    selectedCageKey = nextItem.key;
    draw();
  }

  innerControl.addEventListener(&#x27;change&#x27;, configure);
  outerControl.addEventListener(&#x27;change&#x27;, configure);
  angleControl.addEventListener(&#x27;input&#x27;, draw);
  cagePrevButton.addEventListener(&#x27;click&#x27;, () =&gt; selectAdjacentCage(-1));
  cageNextButton.addEventListener(&#x27;click&#x27;, () =&gt; selectAdjacentCage(1));
  optimumButton.addEventListener(&#x27;click&#x27;, () =&gt; {
    angleControl.value = String(preferredGlobalPhi * 180 / Math.PI);
    draw();
  });
  new ResizeObserver(draw).observe(physicalSvg);
  new ResizeObserver(draw).observe(bridgeSvg);
  new ResizeObserver(draw).observe(certificateSvg);
  configure();
})();

&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;

  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;

  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

    target?.nodeType === Node.ELEMENT_NODE

  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

        offset(tooltipGap),

        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {

              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,

      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {

          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);

      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;

    }

      return;
    }

  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {

    }
  };

    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {

    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);

    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);

    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);

  };

  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {

      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));

      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
