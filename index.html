}

.form-check {

  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)

  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);

}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {

  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;

.form-range::-webkit-slider-runnable-track {
  height: 28px;

}

.form-range::-webkit-slider-thumb {

.form-range:focus-visible::-webkit-slider-thumb {

}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected

  border-color: var(--primary);

  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {

  outline-offset: 2px;

@media (pointer: coarse) {

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;certificate-geometry-intuition&#x27;);
  const innerControl = root.querySelector(&#x27;#cgi-inner&#x27;);
  const outerControl = root.querySelector(&#x27;#cgi-outer&#x27;);
  const angleControl = root.querySelector(&#x27;#cgi-angle&#x27;);
  const angleValue = root.querySelector(&#x27;#cgi-angle-value&#x27;);
  const optimumButton = root.querySelector(&#x27;#cgi-optimum&#x27;);
  const physicalSvg = root.querySelector(&#x27;#cgi-physical&#x27;);
  const bridgeSvg = root.querySelector(&#x27;#cgi-bridge&#x27;);
  const certificateSvg = root.querySelector(&#x27;#cgi-certificate&#x27;);
  const distanceLabel = root.querySelector(&#x27;#cgi-distance&#x27;);
  const scaleLabel = root.querySelector(&#x27;#cgi-scale&#x27;);
  const status = root.querySelector(&#x27;#cgi-status&#x27;);
  const NS = &#x27;http://www.w3.org/2000/svg&#x27;;
  const TAU = 2 * Math.PI;
  let innerSides = 5;
  let outerSides = 8;
  let apothem = Math.cos(Math.PI / 8);
  let normals = [];
  let cages = [];
  let certificateHull = [];
  let closestEdges = [];
  let globalAngles = [];

  const add = (a, b) =&gt; ({x: a.x + b.x, y: a.y + b.y});
  const sub = (a, b) =&gt; ({x: a.x - b.x, y: a.y - b.y});
  const scalePoint = (s, p) =&gt; ({x: s * p.x, y: s * p.y});
  const dot = (a, b) =&gt; a.x * b.x + a.y * b.y;
  const cross = (a, b) =&gt; a.x * b.y - a.y * b.x;
  const mod = (x, m) =&gt; ((x % m) + m) % m;

  function gcd(a, b) {
    while (b) [a, b] = [b, a % b];
    return a;
  }

  function node(name, attrs = {}) {
    const element = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([key, value]) =&gt; element.setAttribute(key, value));
    return element;
  }

  function textNode(svg, value, x, y, className, anchor = &#x27;start&#x27;) {
    const label = node(&#x27;text&#x27;, {x, y, class: className, &#x27;text-anchor&#x27;: anchor});
    label.textContent = value;
    svg.appendChild(label);
  }

  function regularVertices(count, theta = 0) {
    return Array.from({length: count}, (_, k) =&gt; ({x: Math.cos(theta + k * TAU / count), y: Math.sin(theta + k * TAU / count)}));
  }

  function convexHull(points) {
    const canonical = points.map(p =&gt; ({x: Number(p.x.toPrecision(13)), y: Number(p.y.toPrecision(13))}));
    const unique = [...new Map(canonical.map(p =&gt; [`${p.x},${p.y}`, p])).values()].sort((a, b) =&gt; a.x - b.x || a.y - b.y);
    if (unique.length &lt;= 2) return unique;
    const turn = (o, a, b) =&gt; cross(sub(a, o), sub(b, o));
    const lower = [];
    for (const p of unique) {
      while (lower.length &gt;= 2 &amp;&amp; turn(lower.at(-2), lower.at(-1), p) &lt;= 1e-11) lower.pop();
      lower.push(p);
    }
    const upper = [];
    for (let i = unique.length - 1; i &gt;= 0; i--) {
      const p = unique[i];
      while (upper.length &gt;= 2 &amp;&amp; turn(upper.at(-2), upper.at(-1), p) &lt;= 1e-11) upper.pop();
      upper.push(p);
    }
    lower.pop();
    upper.pop();
    return lower.concat(upper);
  }

  function solve3(rows, rhs) {
    const a = rows.map((row, i) =&gt; [...row, rhs[i]]);
    for (let col = 0; col &lt; 3; col++) {
      let pivot = col;
      for (let r = col + 1; r &lt; 3; r++) if (Math.abs(a[r][col]) &gt; Math.abs(a[pivot][col])) pivot = r;
      if (Math.abs(a[pivot][col]) &lt; 1e-11) return null;
      [a[col], a[pivot]] = [a[pivot], a[col]];
      const divisor = a[col][col];
      for (let c = col; c &lt; 4; c++) a[col][c] /= divisor;
      for (let r = 0; r &lt; 3; r++) {
        if (r === col) continue;
        const factor = a[r][col];
        for (let c = col; c &lt; 4; c++) a[r][c] -= factor * a[col][c];
      }
    }
    return [a[0][3], a[1][3], a[2][3]];
  }

  function fitAt(theta) {
    const vertices = regularVertices(innerSides, theta);
    const support = normals.map(n =&gt; Math.max(...vertices.map(p =&gt; dot(n, p))));
    let best = null;
    for (let i = 0; i &lt; outerSides - 2; i++) for (let j = i + 1; j &lt; outerSides - 1; j++) for (let k = j + 1; k &lt; outerSides; k++) {
      const ids = [i, j, k];
      const solution = solve3(ids.map(q =&gt; [normals[q].x, normals[q].y, support[q]]), [apothem, apothem, apothem]);
      if (!solution || solution[2] &lt; 0) continue;
      const [cx, cy, size] = solution;
      const feasible = normals.every((n, q) =&gt; n.x * cx + n.y * cy + support[q] * size &lt;= apothem + 2e-9);
      if (feasible &amp;&amp; (!best || size &gt; best.size)) best = {cx, cy, size};
    }
    if (!best) return {theta, cx: 0, cy: 0, size: 0, polygon: []};
    const polygon = vertices.map(p =&gt; ({x: best.cx + best.size * p.x, y: best.cy + best.size * p.y}));
    return {...best, theta, polygon};
  }

  function enumerateCages() {
    const result = [];
    for (let i = 0; i &lt; outerSides; i++) for (let j = i + 1; j &lt; outerSides; j++) {
      if (Math.abs(cross(normals[i], normals[j])) &lt; 1e-10 &amp;&amp; dot(normals[i], normals[j]) &lt; 0) {
        result.push({support: [i, j], weights: [1 / (2 * apothem), 1 / (2 * apothem)]});
      }
    }
    for (let i = 0; i &lt; outerSides - 2; i++) for (let j = i + 1; j &lt; outerSides - 1; j++) for (let k = j + 1; k &lt; outerSides; k++) {
      let raw = [cross(normals[j], normals[k]), cross(normals[k], normals[i]), cross(normals[i], normals[j])];
      if (raw.every(x =&gt; x &lt; -1e-10)) raw = raw.map(x =&gt; -x);
      if (!raw.every(x =&gt; x &gt; 1e-10)) continue;
      const denominator = apothem * raw.reduce((a, b) =&gt; a + b, 0);
      result.push({support: [i, j, k], weights: raw.map(x =&gt; x / denominator)});
    }
    return result;
  }

  function lMap(normal, point) {
    return {x: dot(normal, point), y: cross(point, normal)};
  }

  function buildCertificate() {
    const inner = regularVertices(innerSides);
    const points = [];
    cages.forEach(cage =&gt; {
      let sumHull = [{x: 0, y: 0}];
      cage.support.forEach((facet, q) =&gt; {
        const summand = inner.map(p =&gt; scalePoint(cage.weights[q], lMap(normals[facet], p)));
        sumHull = convexHull(sumHull.flatMap(a =&gt; summand.map(b =&gt; add(a, b))));
      });
      points.push(...sumHull);
    });
    return convexHull(points);
  }

  function activePatterns(theta) {
    const direction = {x: Math.cos(theta), y: Math.sin(theta)};
    const inner = regularVertices(innerSides);
    let best = -Infinity;
    const cageRows = [];
    cages.forEach((cage, cageIndex) =&gt; {
      const choicesByFacet = cage.support.map((facet, q) =&gt; {
        const choices = inner.map((p, vertex) =&gt; {
          const vector = scalePoint(cage.weights[q], lMap(normals[facet], p));
          return {facet, vertex, vector, weight: cage.weights[q], score: dot(direction, vector)};
        });
        const maximum = Math.max(...choices.map(choice =&gt; choice.score));
        return choices.filter(choice =&gt; maximum - choice.score &lt;= 1e-10);
      });
      const value = choicesByFacet.reduce((sum, choices) =&gt; sum + choices[0].score, 0);
      best = Math.max(best, value);
      cageRows.push({cageIndex, cage, choicesByFacet, value});
    });
    const patterns = [];
    cageRows.filter(row =&gt; best - row.value &lt;= 1e-9).forEach(row =&gt; {
      const expand = (index, contributions) =&gt; {
        if (index === row.choicesByFacet.length) {
          const point = contributions.reduce((sum, item) =&gt; add(sum, item.vector), {x: 0, y: 0});
          patterns.push({cageIndex: row.cageIndex, cage: row.cage, contributions: [...contributions], point, value: row.value});
          return;
        }
        row.choicesByFacet[index].forEach(choice =&gt; expand(index + 1, [...contributions, choice]));
      };
      expand(0, []);
    });
    return patterns.filter((pattern, i) =&gt; patterns.findIndex(other =&gt;
      other.cageIndex === pattern.cageIndex &amp;&amp;
      other.contributions.map(item =&gt; item.vertex).join(&#x27;,&#x27;) === pattern.contributions.map(item =&gt; item.vertex).join(&#x27;,&#x27;)
    ) === i);
  }

  function closestCertificateEdges() {
    let minimum = Infinity;
    const rows = certificateHull.map((u, i) =&gt; {
      const v = certificateHull[(i + 1) % certificateHull.length];
      const d = sub(v, u);
      const distance = Math.abs(cross(u, v)) / Math.hypot(d.x, d.y);
      minimum = Math.min(minimum, distance);
      return {i, u, v, distance};
    });
    return rows.filter(row =&gt; Math.abs(row.distance - minimum) &lt;= 1e-8);
  }

  function outwardNormal(edge) {
    const d = sub(edge.v, edge.u);
    let n = {x: d.y, y: -d.x};
    n = scalePoint(1 / Math.hypot(n.x, n.y), n);
    return dot(n, edge.u) &lt; 0 ? scalePoint(-1, n) : n;
  }

  function pointsAttribute(points, map) {
    return points.map(p =&gt; `${map.x(p.x)},${map.y(p.y)}`).join(&#x27; &#x27;);
  }

  function setupSvg(svg, ratio = 1) {
    const width = Math.max(260, Math.round(svg.getBoundingClientRect().width || 320));
    const height = Math.round(width / ratio);
    svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`);
    svg.replaceChildren();
    svg.appendChild(node(&#x27;rect&#x27;, {x: 16, y: 16, width: width - 32, height: height - 32, class: &#x27;cgi-frame&#x27;}));
    return {width, height};
  }

  function chainLayout(vectors, box) {
    const points = [{x: 0, y: 0}];
    vectors.forEach(vector =&gt; points.push(add(points.at(-1), vector)));
    const xs = points.map(p =&gt; p.x);
    const ys = points.map(p =&gt; p.y);
    const minX = Math.min(...xs);
    const maxX = Math.max(...xs);
    const minY = Math.min(...ys);
    const maxY = Math.max(...ys);
    const rangeX = Math.max(1e-9, maxX - minX);
    const rangeY = Math.max(1e-9, maxY - minY);
    const factor = Math.min((box.width - 72) / rangeX, (box.height - 48) / rangeY);
    const centerX = (minX + maxX) / 2;
    const centerY = (minY + maxY) / 2;
    return points.map(p =&gt; ({x: box.width / 2 + factor * (p.x - centerX), y: box.height / 2 - factor * (p.y - centerY)}));
  }

  function exposedSideMap(patterns) {
    const facets = [...new Set(patterns.flatMap(pattern =&gt; pattern.contributions.map(item =&gt; item.facet)))].sort((a, b) =&gt; a - b);
    return new Map(facets.map((facet, i) =&gt; [facet, i + 1]));
  }

  function seriesClass(number) {
    return `cgi-series-${((number - 1) % 6) + 1}`;
  }

  function drawPhysical(fit, patterns, sideMap) {
    const box = setupSvg(physicalSvg);
    const span = Math.min(box.width, box.height) - 48;
    const map = {x: x =&gt; box.width / 2 + x * span * 0.47, y: y =&gt; box.height / 2 - y * span * 0.47};
    const outer = regularVertices(outerSides, Math.PI / outerSides);
    physicalSvg.appendChild(node(&#x27;polygon&#x27;, {points: pointsAttribute(outer, map), class: &#x27;cgi-outer&#x27;}));
    sideMap.forEach((number, facet) =&gt; {
      const a = outer[(facet - 1 + outerSides) % outerSides];
      const b = outer[facet];
      physicalSvg.appendChild(node(&#x27;line&#x27;, {x1: map.x(a.x), y1: map.y(a.y), x2: map.x(b.x), y2: map.y(b.y), class: `cgi-active-side ${seriesClass(number)}`}));
    });
    physicalSvg.appendChild(node(&#x27;polygon&#x27;, {points: pointsAttribute(fit.polygon, map), class: &#x27;cgi-inner&#x27;}));
    sideMap.forEach((number, facet) =&gt; {
      const n = normals[facet];
      const values = fit.polygon.map(p =&gt; dot(n, p));
      const maximum = Math.max(...values);
      const contactPoints = fit.polygon.filter((p, i) =&gt; maximum - values[i] &lt;= 2e-7);
      if (contactPoints.length &gt; 1) physicalSvg.appendChild(node(&#x27;line&#x27;, {
        x1: map.x(contactPoints[0].x), y1: map.y(contactPoints[0].y),
        x2: map.x(contactPoints.at(-1).x), y2: map.y(contactPoints.at(-1).y),
        class: `cgi-active-side ${seriesClass(number)}`
      }));
      const center = contactPoints.reduce((sum, p) =&gt; add(sum, p), {x: 0, y: 0});
      center.x /= contactPoints.length;
      center.y /= contactPoints.length;
      physicalSvg.appendChild(node(&#x27;line&#x27;, {x1: map.x(center.x), y1: map.y(center.y), x2: map.x(center.x + 0.18 * n.x), y2: map.y(center.y + 0.18 * n.y), class: `cgi-vector ${seriesClass(number)}`}));
      contactPoints.forEach(p =&gt; physicalSvg.appendChild(node(&#x27;circle&#x27;, {cx: map.x(p.x), cy: map.y(p.y), r: 6, class: `cgi-contact ${seriesClass(number)}`})));
      textNode(physicalSvg, String(number), map.x(center.x) + 9, map.y(center.y) - 8, &#x27;cgi-number&#x27;);
    });
  }

  function chainIntoBox(vectors, x, y, width, height) {
    const points = [{x: 0, y: 0}];
    vectors.forEach(vector =&gt; points.push(add(points.at(-1), vector)));
    const xs = points.map(p =&gt; p.x);
    const ys = points.map(p =&gt; p.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const factor = Math.min(width / Math.max(1e-9, maxX - minX), height / Math.max(1e-9, maxY - minY));
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    return points.map(p =&gt; ({x: x + width / 2 + factor * (p.x - cx), y: y + height / 2 - factor * (p.y - cy)}));
  }

  function drawBridge(patterns, sideMap) {
    const shown = patterns.slice(0, 6);
    const width = Math.max(280, Math.round(bridgeSvg.getBoundingClientRect().width || 320));
    const rowHeight = 82;
    const height = 34 + shown.length * rowHeight;
    bridgeSvg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`);
    bridgeSvg.style.aspectRatio = `${width} / ${height}`;
    bridgeSvg.replaceChildren();
    bridgeSvg.appendChild(node(&#x27;rect&#x27;, {x: 16, y: 16, width: width - 32, height: height - 32, class: &#x27;cgi-frame&#x27;}));
    textNode(bridgeSvg, &#x27;balanced normals: Σλn = 0&#x27;, width * 0.27, 31, &#x27;cgi-math-label&#x27;, &#x27;middle&#x27;);
    textNode(bridgeSvg, &#x27;support sum: ΣλL = g&#x27;, width * 0.74, 31, &#x27;cgi-math-label&#x27;, &#x27;middle&#x27;);
    shown.forEach((pattern, row) =&gt; {
      const top = 39 + row * rowHeight;
      const weighted = pattern.contributions.map(item =&gt; scalePoint(item.weight, normals[item.facet]));
      const leftChain = chainIntoBox(weighted, 25, top + 12, width * 0.38, rowHeight - 28);
      const rightChain = chainIntoBox(pattern.contributions.map(item =&gt; item.vector), width * 0.54, top + 12, width * 0.37, rowHeight - 28);
      textNode(bridgeSvg, `g${row + 1}`, width * 0.48, top + rowHeight / 2, &#x27;cgi-math-label&#x27;, &#x27;middle&#x27;);
      pattern.contributions.forEach((item, i) =&gt; {
        const number = sideMap.get(item.facet);
        const className = `cgi-vector ${seriesClass(number)}`;
        bridgeSvg.appendChild(node(&#x27;line&#x27;, {x1: leftChain[i].x, y1: leftChain[i].y, x2: leftChain[i + 1].x, y2: leftChain[i + 1].y, class: className}));
        bridgeSvg.appendChild(node(&#x27;line&#x27;, {x1: rightChain[i].x, y1: rightChain[i].y, x2: rightChain[i + 1].x, y2: rightChain[i + 1].y, class: className}));
        textNode(bridgeSvg, String(number), (rightChain[i].x + rightChain[i + 1].x) / 2 + 5, (rightChain[i].y + rightChain[i + 1].y) / 2 - 4, &#x27;cgi-number&#x27;);
      });
      bridgeSvg.appendChild(node(&#x27;circle&#x27;, {cx: leftChain[0].x, cy: leftChain[0].y, r: 3, class: &#x27;cgi-origin&#x27;}));
      bridgeSvg.appendChild(node(&#x27;circle&#x27;, {cx: rightChain.at(-1).x, cy: rightChain.at(-1).y, r: 5, class: &#x27;cgi-current-point&#x27;}));
    });
  }

  function drawCertificate(theta, patterns) {
    const box = setupSvg(certificateSvg);
    const extent = Math.max(...certificateHull.map(p =&gt; Math.max(Math.abs(p.x), Math.abs(p.y)))) * 1.25;
    const span = Math.min(box.width, box.height) - 52;
    const map = {x: x =&gt; box.width / 2 + x * span / (2 * extent), y: y =&gt; box.height / 2 - y * span / (2 * extent)};
    certificateSvg.appendChild(node(&#x27;polygon&#x27;, {points: pointsAttribute(certificateHull, map), class: &#x27;cgi-cert&#x27;}));
    certificateHull.forEach(p =&gt; certificateSvg.appendChild(node(&#x27;circle&#x27;, {cx: map.x(p.x), cy: map.y(p.y), r: 2, class: &#x27;cgi-cert-point&#x27;})));
    closestEdges.forEach(edge =&gt; certificateSvg.appendChild(node(&#x27;line&#x27;, {x1: map.x(edge.u.x), y1: map.y(edge.u.y), x2: map.x(edge.v.x), y2: map.y(edge.v.y), class: &#x27;cgi-closest&#x27;})));
    const direction = {x: Math.cos(theta), y: Math.sin(theta)};
    const distance = patterns[0].value;
    const tangent = {x: -direction.y, y: direction.x};
    const lineA = add(scalePoint(distance, direction), scalePoint(-2 * extent, tangent));
    const lineB = add(scalePoint(distance, direction), scalePoint(2 * extent, tangent));
    certificateSvg.appendChild(node(&#x27;line&#x27;, {x1: map.x(lineA.x), y1: map.y(lineA.y), x2: map.x(lineB.x), y2: map.y(lineB.y), class: &#x27;cgi-tangent&#x27;}));
    certificateSvg.appendChild(node(&#x27;line&#x27;, {x1: map.x(0), y1: map.y(0), x2: map.x(distance * direction.x), y2: map.y(distance * direction.y), class: &#x27;cgi-distance-line&#x27;}));
    certificateSvg.appendChild(node(&#x27;circle&#x27;, {cx: map.x(0), cy: map.y(0), r: 3, class: &#x27;cgi-origin&#x27;}));
    const exposedPoints = [...new Map(patterns.map(pattern =&gt; [`${pattern.point.x.toPrecision(12)},${pattern.point.y.toPrecision(12)}`, pattern.point])).values()];
    if (exposedPoints.length &gt; 1) {
      const ordered = [...exposedPoints].sort((a, b) =&gt; dot(tangent, a) - dot(tangent, b));
      certificateSvg.appendChild(node(&#x27;line&#x27;, {x1: map.x(ordered[0].x), y1: map.y(ordered[0].y), x2: map.x(ordered.at(-1).x), y2: map.y(ordered.at(-1).y), class: &#x27;cgi-exposed&#x27;}));
    }
    exposedPoints.forEach((point, i) =&gt; {
      certificateSvg.appendChild(node(&#x27;circle&#x27;, {cx: map.x(point.x), cy: map.y(point.y), r: 6, class: &#x27;cgi-current-point&#x27;}));
      textNode(certificateSvg, `g${i + 1}`, map.x(point.x) + 8, map.y(point.y) - 7, &#x27;cgi-math-label&#x27;);
    });
    textNode(certificateSvg, &#x27;d&#x27;, map.x(distance * direction.x / 2) + 7, map.y(distance * direction.y / 2) - 7, &#x27;cgi-math-label&#x27;);
    return distance;
  }

  function configure() {
    innerSides = Math.max(3, Math.min(20, Math.round(Number(innerControl.value) || 5)));
    outerSides = Math.max(3, Math.min(20, Math.round(Number(outerControl.value) || 8)));
    innerControl.value = String(innerSides);
    outerControl.value = String(outerSides);
    apothem = Math.cos(Math.PI / outerSides);
    normals = Array.from({length: outerSides}, (_, j) =&gt; ({x: Math.cos(j * TAU / outerSides), y: Math.sin(j * TAU / outerSides)}));
    cages = enumerateCages();
    certificateHull = buildCertificate();
    closestEdges = closestCertificateEdges();
    globalAngles = closestEdges.map(edge =&gt; {
      const n = outwardNormal(edge);
      return mod(Math.atan2(n.y, n.x), TAU);
    });
    draw();
  }

  function draw() {
    if (!certificateHull.length) return;
    const theta = Number(angleControl.value) * Math.PI / 180;
    const fit = fitAt(theta);
    const patterns = activePatterns(theta);
    const sideMap = exposedSideMap(patterns);
    drawPhysical(fit, patterns, sideMap);
    drawBridge(patterns, sideMap);
    const distance = drawCertificate(theta, patterns);
    const scale = 1 / distance;
    const isGlobal = globalAngles.some(value =&gt; Math.abs(Math.atan2(Math.sin(theta - value), Math.cos(theta - value))) &lt;= 0.003);
    angleValue.textContent = `${(theta * 180 / Math.PI).toFixed(2)}°`;
    distanceLabel.textContent = `d = ${distance.toFixed(7)}`;
    scaleLabel.textContent = `μ = 1/d = ${scale.toFixed(7)}`;
    const sides = [...sideMap.keys()].map(facet =&gt; facet + 1).join(&#x27;, &#x27;);
    const hidden = patterns.length &gt; 6 ? ` The bridge shows 6 of ${patterns.length} tied generators.` : &#x27;&#x27;;
    const repeatDegrees = 360 / (innerSides * outerSides / gcd(innerSides, outerSides));
    status.textContent = `${patterns.length} exposed generator${patterns.length === 1 ? &#x27;&#x27; : &#x27;s&#x27;} jointly use outer sides ${sides}. Their union supplies ${sideMap.size} physical contact side${sideMap.size === 1 ? &#x27;&#x27; : &#x27;s&#x27;}. The physical solver gives μ = ${fit.size.toFixed(7)}, matching the certificate reciprocal${isGlobal ? ` at a global optimum; equivalent optima repeat every ${repeatDegrees.toFixed(6)}°` : &#x27;&#x27;}.${hidden} Numerical regular-polygon illustration.`;
  }

  innerControl.addEventListener(&#x27;change&#x27;, configure);
  outerControl.addEventListener(&#x27;change&#x27;, configure);
  angleControl.addEventListener(&#x27;input&#x27;, draw);
  optimumButton.addEventListener(&#x27;click&#x27;, () =&gt; {
    if (!globalAngles.length) return;
    const current = Number(angleControl.value) * Math.PI / 180;
    const nearest = globalAngles.reduce((best, candidate) =&gt; {
      const bestDistance = Math.abs(Math.atan2(Math.sin(best - current), Math.cos(best - current)));
      const candidateDistance = Math.abs(Math.atan2(Math.sin(candidate - current), Math.cos(candidate - current)));
      return candidateDistance &lt; bestDistance ? candidate : best;
    });
    angleControl.value = String(nearest * 180 / Math.PI);
    draw();
  });
  new ResizeObserver(draw).observe(physicalSvg);
  new ResizeObserver(draw).observe(bridgeSvg);
  new ResizeObserver(draw).observe(certificateSvg);
  configure();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {

  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
