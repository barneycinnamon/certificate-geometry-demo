    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;platonic-certificate-geometry&quot;&gt;
  &lt;h2&gt;Platonic containment: from face contacts to a certificate slice&lt;/h2&gt;
  &lt;div class=&quot;viz-controls&quot; aria-label=&quot;Solid and rotation controls&quot;&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;pcg-inner&quot;&gt;Inner solid
      &lt;select class=&quot;form-select&quot; id=&quot;pcg-inner&quot;&gt;
        &lt;option value=&quot;tetrahedron&quot;&gt;Tetrahedron&lt;/option&gt;
        &lt;option value=&quot;cube&quot;&gt;Cube&lt;/option&gt;
        &lt;option value=&quot;octahedron&quot; selected&gt;Octahedron&lt;/option&gt;
        &lt;option value=&quot;dodecahedron&quot;&gt;Dodecahedron&lt;/option&gt;
        &lt;option value=&quot;icosahedron&quot;&gt;Icosahedron&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;pcg-outer&quot;&gt;Outer solid
      &lt;select class=&quot;form-select&quot; id=&quot;pcg-outer&quot;&gt;
        &lt;option value=&quot;tetrahedron&quot; selected&gt;Tetrahedron&lt;/option&gt;
        &lt;option value=&quot;cube&quot;&gt;Cube&lt;/option&gt;
        &lt;option value=&quot;octahedron&quot;&gt;Octahedron&lt;/option&gt;
        &lt;option value=&quot;dodecahedron&quot;&gt;Dodecahedron&lt;/option&gt;
        &lt;option value=&quot;icosahedron&quot;&gt;Icosahedron&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;pcg-axis&quot;&gt;Inner rotation axis
      &lt;select class=&quot;form-select&quot; id=&quot;pcg-axis&quot;&gt;
        &lt;option value=&quot;x&quot;&gt;x-axis&lt;/option&gt;
        &lt;option value=&quot;y&quot;&gt;y-axis&lt;/option&gt;
        &lt;option value=&quot;z&quot; selected&gt;z-axis&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label pcg-angle-control&quot; for=&quot;pcg-angle&quot;&gt;Inner rotation θ &lt;span id=&quot;pcg-angle-value&quot; class=&quot;tabular-nums&quot;&gt;0.00°&lt;/span&gt;
      &lt;input class=&quot;form-range&quot; id=&quot;pcg-angle&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;360&quot; step=&quot;0.05&quot; value=&quot;0&quot;&gt;
    &lt;/label&gt;
    &lt;button class=&quot;btn&quot; id=&quot;pcg-best&quot; type=&quot;button&quot;&gt;Show sampled best on this axis slice&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;pcg-scope text-small text-muted&quot;&gt;&lt;strong&gt;Scope:&lt;/strong&gt; translation and scale are re-optimized at every angle, but inner-solid rotation is restricted to the selected axis of the outer-solid frame. “Best” means best on this sampled one-parameter slice, not a certified optimum over all of SO(3).&lt;/div&gt;

  &lt;div class=&quot;pcg-panels&quot;&gt;
    &lt;section aria-labelledby=&quot;pcg-physical-title&quot;&gt;
      &lt;h3 id=&quot;pcg-physical-title&quot;&gt;1 · Fit and face contacts&lt;/h3&gt;
      &lt;div class=&quot;pcg-panel-caption text-small text-muted&quot;&gt;Purple is the contained solid. Green outer faces are tight; numbered purple outlines identify the cage worked through in Panel 2.&lt;/div&gt;
      &lt;div id=&quot;pcg-physical-summary&quot; class=&quot;pcg-panel-summary text-small tabular-nums&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
      &lt;svg id=&quot;pcg-physical&quot; role=&quot;img&quot; aria-describedby=&quot;pcg-view-instruction&quot; aria-label=&quot;A Platonic solid optimally translated and scaled inside another at the selected fixed-axis rotation&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;viz-row pcg-view-controls text-small&quot;&gt;
        &lt;span id=&quot;pcg-view-instruction&quot; class=&quot;text-muted&quot;&gt;Drag or touch to orbit both solids together (camera only). θ rotates the inner solid relative to the outer.&lt;/span&gt;
        &lt;button class=&quot;btn&quot; id=&quot;pcg-reset-view&quot; type=&quot;button&quot; aria-controls=&quot;pcg-physical&quot;&gt;Reset view&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;pcg-key text-small text-muted&quot;&gt;Green marks contact features · open circle: outer center · purple dot: inner center · dashed link: chosen optimal translation&lt;/div&gt;
    &lt;/section&gt;

    &lt;section aria-labelledby=&quot;pcg-bridge-title&quot;&gt;
      &lt;h3 id=&quot;pcg-bridge-title&quot;&gt;2 · One balanced cage, worked through&lt;/h3&gt;
      &lt;div class=&quot;pcg-panel-caption text-small text-muted&quot;&gt;In three dimensions, a minimal cage needs at most four outward face normals. The arrows are certificate bookkeeping, not physical forces.&lt;/div&gt;
      &lt;div class=&quot;pcg-example-selector&quot; aria-label=&quot;Choose an active cage example&quot;&gt;
        &lt;button class=&quot;btn&quot; id=&quot;pcg-example-prev&quot; type=&quot;button&quot; aria-controls=&quot;pcg-physical pcg-bridge pcg-chart&quot;&gt;Previous example&lt;/button&gt;
        &lt;span id=&quot;pcg-example-position&quot; class=&quot;pcg-example-position text-small tabular-nums&quot;&gt;&lt;/span&gt;
        &lt;button class=&quot;btn&quot; id=&quot;pcg-example-next&quot; type=&quot;button&quot; aria-controls=&quot;pcg-physical pcg-bridge pcg-chart&quot;&gt;Next example&lt;/button&gt;
      &lt;/div&gt;
      &lt;div id=&quot;pcg-bridge-summary&quot; class=&quot;pcg-panel-summary pcg-bridge-summary text-small&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
      &lt;svg id=&quot;pcg-bridge&quot; role=&quot;img&quot; aria-label=&quot;A balanced three-dimensional normal cage transformed into one axis-slice certificate branch&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;pcg-derivation text-small&quot; aria-label=&quot;Why a balanced cage bounds scale independently of translation&quot;&gt;
        &lt;span&gt;&lt;strong&gt;Normals balance&lt;/strong&gt;&lt;small&gt;Σλⱼnⱼ = 0&lt;/small&gt;&lt;/span&gt;
        &lt;b&gt;+&lt;/b&gt;
        &lt;span&gt;&lt;strong&gt;Same weights&lt;/strong&gt;&lt;small&gt;M = Σλⱼnⱼpⱼᵀ&lt;/small&gt;&lt;/span&gt;
        &lt;b&gt;⇒&lt;/b&gt;
        &lt;span&gt;&lt;strong&gt;Translation cancels from the bound&lt;/strong&gt;&lt;small&gt;μ⟨M,R(θ)⟩ ≤ 1&lt;/small&gt;&lt;/span&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section aria-labelledby=&quot;pcg-chart-title&quot;&gt;
      &lt;h3 id=&quot;pcg-chart-title&quot;&gt;3 · Certificate envelope → scale&lt;/h3&gt;
      &lt;div class=&quot;pcg-panel-caption text-small text-muted&quot;&gt;Each matrix certificate becomes a score curve on this axis slice. The green upper envelope is d(θ), so μ(θ)=1/d(θ): lower d means a larger contained solid.&lt;/div&gt;
      &lt;div id=&quot;pcg-chart-summary&quot; class=&quot;pcg-panel-summary text-small tabular-nums&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
      &lt;svg id=&quot;pcg-chart&quot; role=&quot;img&quot; aria-label=&quot;Axis-slice certificate score curves and their upper envelope&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;pcg-key text-small text-muted&quot;&gt;Gray: other exposed branches · purple: selected branch · green: envelope d(θ) · orange: sampled slice best&lt;/div&gt;
    &lt;/section&gt;
  &lt;/div&gt;
  &lt;div class=&quot;pcg-caveat text-small text-muted&quot;&gt;&lt;strong&gt;Why a slice?&lt;/strong&gt; The planar certificate is a drawable polygon. Here each certificate is a 3×3 matrix, so the full certificate body can live in nine dimensions. Panel 3 is an honest one-dimensional view of that higher-dimensional object.&lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;platonic-certificate-geometry&#x27;);
  const innerControl = root.querySelector(&#x27;#pcg-inner&#x27;);
  const outerControl = root.querySelector(&#x27;#pcg-outer&#x27;);
  const axisControl = root.querySelector(&#x27;#pcg-axis&#x27;);
  const angleControl = root.querySelector(&#x27;#pcg-angle&#x27;);
  const angleValue = root.querySelector(&#x27;#pcg-angle-value&#x27;);
  const bestButton = root.querySelector(&#x27;#pcg-best&#x27;);
  const resetViewButton = root.querySelector(&#x27;#pcg-reset-view&#x27;);
  const prevButton = root.querySelector(&#x27;#pcg-example-prev&#x27;);
  const nextButton = root.querySelector(&#x27;#pcg-example-next&#x27;);
  const examplePosition = root.querySelector(&#x27;#pcg-example-position&#x27;);
  const physicalSummary = root.querySelector(&#x27;#pcg-physical-summary&#x27;);
  const bridgeSummary = root.querySelector(&#x27;#pcg-bridge-summary&#x27;);
  const chartSummary = root.querySelector(&#x27;#pcg-chart-summary&#x27;);
  const physicalSvg = root.querySelector(&#x27;#pcg-physical&#x27;);
  const bridgeSvg = root.querySelector(&#x27;#pcg-bridge&#x27;);
  const chartSvg = root.querySelector(&#x27;#pcg-chart&#x27;);
  const NS = &#x27;http://www.w3.org/2000/svg&#x27;;
  const TAU = 2 * Math.PI;
  const DEG = Math.PI / 180;
  const PHI = (1 + Math.sqrt(5)) / 2;
  const DEFAULT_CAMERA = {yaw: -0.72, pitch: -0.58};
  const AXES = {x: {x: 1, y: 0, z: 0}, y: {x: 0, y: 1, z: 0}, z: {x: 0, y: 0, z: 1}};
  const SOLID_NAMES = {
    tetrahedron: &#x27;tetrahedron&#x27;, cube: &#x27;cube&#x27;, octahedron: &#x27;octahedron&#x27;,
    dodecahedron: &#x27;dodecahedron&#x27;, icosahedron: &#x27;icosahedron&#x27;
  };
  const solidCache = new Map();
  let innerSolid = null;
  let outerSolid = null;
  let axis = AXES.z;
  let cages = [];
  let sliceData = null;
  let currentItems = [];
  let selectedItemKey = null;
  let selectedCageKey = null;
  let chartGeometry = null;
  let cameraYaw = DEFAULT_CAMERA.yaw;
  let cameraPitch = DEFAULT_CAMERA.pitch;
  let currentPhysicalFit = null;
  let currentPhysicalPattern = null;
  let orbitPointerId = null;
  let orbitLastPoint = null;
  let orbitRadiansPerPixel = 0.009;
  let physicalRedrawFrame = null;

  const v3 = (x, y, z) =&gt; ({x, y, z});
  const add3 = (a, b) =&gt; v3(a.x + b.x, a.y + b.y, a.z + b.z);
  const sub3 = (a, b) =&gt; v3(a.x - b.x, a.y - b.y, a.z - b.z);
  const scale3 = (s, a) =&gt; v3(s * a.x, s * a.y, s * a.z);
  const dot3 = (a, b) =&gt; a.x * b.x + a.y * b.y + a.z * b.z;
  const cross3 = (a, b) =&gt; v3(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
  const norm3 = a =&gt; Math.hypot(a.x, a.y, a.z);
  const unit3 = a =&gt; scale3(1 / Math.max(1e-15, norm3(a)), a);
  const det3 = (a, b, c) =&gt; dot3(a, cross3(b, c));
  const mod = (x, m) =&gt; ((x % m) + m) % m;
  const subscriptNumber = value =&gt; String(value).replace(/\d/g, digit =&gt; &#x27;₀₁₂₃₄₅₆₇₈₉&#x27;[Number(digit)]);

  function node(name, attrs = {}) {
    const element = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([key, value]) =&gt; element.setAttribute(key, value));
    return element;
  }

  function textNode(svg, value, x, y, className, anchor = &#x27;start&#x27;) {
    const label = node(&#x27;text&#x27;, {x, y, class: className, &#x27;text-anchor&#x27;: anchor});
    label.textContent = value;
    svg.appendChild(label);
    return label;
  }

  function rotateAboutAxis(point, a, theta) {
    const c = Math.cos(theta), s = Math.sin(theta);
    return add3(
      add3(scale3(c, point), scale3(s, cross3(a, point))),
      scale3((1 - c) * dot3(a, point), a)
    );
  }

  function rawVertices(kind) {
    const signs = [-1, 1];
    if (kind === &#x27;tetrahedron&#x27;) return [
      v3(1, 1, 1), v3(1, -1, -1), v3(-1, 1, -1), v3(-1, -1, 1)
    ];
    if (kind === &#x27;cube&#x27;) return signs.flatMap(x =&gt; signs.flatMap(y =&gt; signs.map(z =&gt; v3(x, y, z))));
    if (kind === &#x27;octahedron&#x27;) return [v3(1, 0, 0), v3(-1, 0, 0), v3(0, 1, 0), v3(0, -1, 0), v3(0, 0, 1), v3(0, 0, -1)];
    if (kind === &#x27;icosahedron&#x27;) {
      const result = [];
      signs.forEach(a =&gt; signs.forEach(b =&gt; {
        result.push(v3(0, a, b * PHI), v3(a, b * PHI, 0), v3(a * PHI, 0, b));
      }));
      return result;
    }
    const result = signs.flatMap(x =&gt; signs.flatMap(y =&gt; signs.map(z =&gt; v3(x, y, z))));
    signs.forEach(a =&gt; signs.forEach(b =&gt; {
      result.push(v3(0, a / PHI, b * PHI), v3(a / PHI, b * PHI, 0), v3(a * PHI, 0, b / PHI));
    }));
    return result;
  }

  function hullFaces(vertices) {
    const faceMap = new Map();
    const tolerance = 2e-8;
    for (let i = 0; i &lt; vertices.length - 2; i++) for (let j = i + 1; j &lt; vertices.length - 1; j++) for (let k = j + 1; k &lt; vertices.length; k++) {
      let normal = cross3(sub3(vertices[j], vertices[i]), sub3(vertices[k], vertices[i]));
      if (norm3(normal) &lt;= 1e-10) continue;
      normal = unit3(normal);
      let h = dot3(normal, vertices[i]);
      const differences = vertices.map(vertex =&gt; dot3(normal, vertex) - h);
      if (Math.max(...differences) &gt; tolerance) {
        if (Math.min(...differences) &lt; -tolerance) continue;
        normal = scale3(-1, normal);
        h = -h;
      }
      if (h &lt;= 1e-8) continue;
      const ids = vertices.map((vertex, index) =&gt; Math.abs(dot3(normal, vertex) - h) &lt;= tolerance ? index : -1).filter(index =&gt; index &gt;= 0);
      if (ids.length &lt; 3) continue;
      const key = [...ids].sort((a, b) =&gt; a - b).join(&#x27;,&#x27;);
      if (faceMap.has(key)) continue;
      const center = scale3(1 / ids.length, ids.reduce((sum, id) =&gt; add3(sum, vertices[id]), v3(0, 0, 0)));
      const basisU = unit3(sub3(vertices[ids[0]], center));
      const basisV = cross3(normal, basisU);
      let ordered = [...ids].sort((a, b) =&gt; {
        const da = sub3(vertices[a], center), db = sub3(vertices[b], center);
        return Math.atan2(dot3(da, basisV), dot3(da, basisU)) - Math.atan2(dot3(db, basisV), dot3(db, basisU));
      });
      const orderedNormal = cross3(sub3(vertices[ordered[1]], vertices[ordered[0]]), sub3(vertices[ordered[2]], vertices[ordered[1]]));
      if (dot3(orderedNormal, normal) &lt; 0) ordered = ordered.reverse();
      faceMap.set(key, {vertices: ordered, normal, h, center});
    }
    const faces = [...faceMap.values()].sort((a, b) =&gt;
      a.normal.z - b.normal.z || a.normal.y - b.normal.y || a.normal.x - b.normal.x
    );
    faces.forEach((face, index) =&gt; { face.index = index; });
    return faces;
  }

  function buildSolid(kind) {
    if (solidCache.has(kind)) return solidCache.get(kind);
    const raw = rawVertices(kind);
    const radius = Math.max(...raw.map(norm3));
    const vertices = raw.map(vertex =&gt; scale3(1 / radius, vertex));
    const faces = hullFaces(vertices);
    const edgeMap = new Map();
    faces.forEach(face =&gt; face.vertices.forEach((vertex, index) =&gt; {
      const next = face.vertices[(index + 1) % face.vertices.length];
      const key = vertex &lt; next ? `${vertex},${next}` : `${next},${vertex}`;
      if (!edgeMap.has(key)) edgeMap.set(key, [vertex, next]);
    }));
    const solid = {kind, name: SOLID_NAMES[kind], vertices, faces, edges: [...edgeMap.values()]};
    solidCache.set(kind, solid);
    return solid;
  }

  function crossArray(a, b) {
    return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  }

  function normalizeCage(facets, rawWeights, outer) {
    let weights = [...rawWeights];
    if (weights.every(value =&gt; value &lt; -1e-10)) weights = weights.map(value =&gt; -value);
    if (!weights.every(value =&gt; value &gt; 1e-10)) return null;
    const denominator = weights.reduce((sum, weight, index) =&gt; sum + weight * outer.faces[facets[index]].h, 0);
    weights = weights.map(value =&gt; value / denominator);
    const balance = facets.reduce((sum, facet, index) =&gt; add3(sum, scale3(weights[index], outer.faces[facet].normal)), v3(0, 0, 0));
    if (norm3(balance) &gt; 2e-8) return null;
    return {facets, weights, balanceResidual: norm3(balance)};
  }

  function enumerateCages(outer) {
    const result = [];
    const normals = outer.faces.map(face =&gt; face.normal);
    for (let i = 0; i &lt; normals.length - 1; i++) for (let j = i + 1; j &lt; normals.length; j++) {
      if (norm3(cross3(normals[i], normals[j])) &lt;= 1e-9 &amp;&amp; dot3(normals[i], normals[j]) &lt; -1 + 1e-8) {
        const cage = normalizeCage([i, j], [1, 1], outer);
        if (cage) result.push(cage);
      }
    }
    for (let i = 0; i &lt; normals.length - 2; i++) for (let j = i + 1; j &lt; normals.length - 1; j++) for (let k = j + 1; k &lt; normals.length; k++) {
      const columns = [normals[i], normals[j], normals[k]];
      const rows = [columns.map(n =&gt; n.x), columns.map(n =&gt; n.y), columns.map(n =&gt; n.z)];
      const candidates = [crossArray(rows[0], rows[1]), crossArray(rows[0], rows[2]), crossArray(rows[1], rows[2])];
      const raw = candidates.sort((a, b) =&gt; Math.hypot(...b) - Math.hypot(...a))[0];
      if (Math.hypot(...raw) &lt;= 1e-9) continue;
      const residual = rows.map(row =&gt; row.reduce((sum, value, q) =&gt; sum + value * raw[q], 0));
      if (Math.hypot(...residual) &gt; 2e-8) continue;
      const cage = normalizeCage([i, j, k], raw, outer);
      if (cage) result.push(cage);
    }
    for (let i = 0; i &lt; normals.length - 3; i++) for (let j = i + 1; j &lt; normals.length - 2; j++) for (let k = j + 1; k &lt; normals.length - 1; k++) for (let l = k + 1; l &lt; normals.length; l++) {
      const raw = [
        det3(normals[j], normals[k], normals[l]),
        -det3(normals[i], normals[k], normals[l]),
        det3(normals[i], normals[j], normals[l]),
        -det3(normals[i], normals[j], normals[k])
      ];
      const cage = normalizeCage([i, j, k, l], raw, outer);
      if (cage) result.push(cage);
    }
    return result.sort((a, b) =&gt; b.facets.length - a.facets.length || a.facets.join(&#x27;,&#x27;).localeCompare(b.facets.join(&#x27;,&#x27;), undefined, {numeric: true}));
  }

  function coefficientFor(normal, point, rotationAxis) {
    const constant = dot3(normal, rotationAxis) * dot3(rotationAxis, point);
    return {
      A: dot3(normal, point) - constant,
      B: dot3(normal, cross3(rotationAxis, point)),
      C: constant
    };
  }

  function addCoefficient(a, b) {
    return {A: a.A + b.A, B: a.B + b.B, C: a.C + b.C};
  }

  function scaleCoefficient(s, value) {
    return {A: s * value.A, B: s * value.B, C: s * value.C};
  }

  function branchValue(g, theta) {
    return g.C + g.A * Math.cos(theta) + g.B * Math.sin(theta);
  }

  function evaluate(theta, withTies = false) {
    const rotatedVertices = innerSolid.vertices.map(vertex =&gt; rotateAboutAxis(vertex, axis, theta));
    const supports = [];
    const ties = [];
    const firstVertices = [];
    outerSolid.faces.forEach(face =&gt; {
      const values = rotatedVertices.map(vertex =&gt; dot3(face.normal, vertex));
      const maximum = Math.max(...values);
      supports.push(maximum);
      const winners = values.map((value, index) =&gt; maximum - value &lt;= 2e-9 ? index : -1).filter(index =&gt; index &gt;= 0);
      firstVertices.push(winners[0]);
      ties.push(withTies ? winners : [winners[0]]);
    });
    const scores = cages.map(cage =&gt; cage.facets.reduce((sum, facet, index) =&gt; sum + cage.weights[index] * supports[facet], 0));
    const d = Math.max(...scores);
    return {theta, rotatedVertices, supports, ties, firstVertices, scores, d, mu: 1 / d};
  }

  function patternForCage(cageIndex, evaluation, vertexIds) {
    const cage = cages[cageIndex];
    const contributions = cage.facets.map((facet, index) =&gt; {
      const vertex = vertexIds[index];
      const coefficient = scaleCoefficient(cage.weights[index], coefficientFor(outerSolid.faces[facet].normal, innerSolid.vertices[vertex], axis));
      return {
        facet,
        vertex,
        weight: cage.weights[index],
        normal: outerSolid.faces[facet].normal,
        weightedNormal: scale3(cage.weights[index], outerSolid.faces[facet].normal),
        coefficient
      };
    });
    const g = contributions.reduce((sum, item) =&gt; addCoefficient(sum, item.coefficient), {A: 0, B: 0, C: 0});
    return {cageIndex, cage, contributions, g, value: branchValue(g, evaluation.theta)};
  }

  function activePatterns(evaluation) {
    const tolerance = 2e-8 * Math.max(1, evaluation.d);
    const activeCages = evaluation.scores.map((score, index) =&gt; evaluation.d - score &lt;= tolerance ? index : -1).filter(index =&gt; index &gt;= 0);
    const patterns = [];
    let truncated = false;
    for (const cageIndex of activeCages) {
      const cage = cages[cageIndex];
      const choices = cage.facets.map(facet =&gt; evaluation.ties[facet]);
      let emitted = 0;
      const expand = (index, vertices) =&gt; {
        if (patterns.length &gt;= 4096 || emitted &gt;= 128) { truncated = true; return; }
        if (index === choices.length) {
          patterns.push(patternForCage(cageIndex, evaluation, vertices));
          emitted += 1;
          return;
        }
        choices[index].forEach(vertex =&gt; expand(index + 1, [...vertices, vertex]));
      };
      expand(0, []);
    }
    return {patterns, truncated, activeCageCount: activeCages.length};
  }

  function selectTeachingPattern(patterns) {
    const legibility = pattern =&gt; {
      const weights = pattern.cage.weights;
      return Math.min(...weights) / Math.max(...weights);
    };
    return [...patterns].sort((a, b) =&gt;
      b.contributions.length - a.contributions.length
      || legibility(b) - legibility(a)
      || a.cage.facets.join(&#x27;,&#x27;).localeCompare(b.cage.facets.join(&#x27;,&#x27;), undefined, {numeric: true})
      || a.contributions.map(item =&gt; item.vertex).join(&#x27;,&#x27;).localeCompare(b.contributions.map(item =&gt; item.vertex).join(&#x27;,&#x27;), undefined, {numeric: true})
    )[0] ?? null;
  }

  function coefficientKey(g) {
    const clean = value =&gt; Math.abs(value) &lt;= 5e-11 ? 0 : value;
    return `${clean(g.A).toFixed(8)},${clean(g.B).toFixed(8)},${clean(g.C).toFixed(8)}`;
  }

  function cageView(active, theta) {
    const map = new Map();
    active.patterns.forEach(pattern =&gt; {
      const key = coefficientKey(pattern.g);
      if (!map.has(key)) map.set(key, {key, g: pattern.g, patterns: []});
      map.get(key).patterns.push(pattern);
    });
    let groups = [...map.values()].map(group =&gt; ({
      ...group,
      representative: selectTeachingPattern(group.patterns),
      cageCount: new Set(group.patterns.map(pattern =&gt; pattern.cageIndex)).size
    })).sort((a, b) =&gt; {
      const derivativeA = -a.g.A * Math.sin(theta) + a.g.B * Math.cos(theta);
      const derivativeB = -b.g.A * Math.sin(theta) + b.g.B * Math.cos(theta);
      return derivativeA - derivativeB || a.g.A - b.g.A || a.g.B - b.g.B || a.g.C - b.g.C;
    });
    const fullGroupCount = groups.length;
    const teachingPattern = selectTeachingPattern(active.patterns);
    const teachingKey = teachingPattern ? coefficientKey(teachingPattern.g) : groups[0]?.key;
    let sampled = false;
    if (groups.length &gt; 48) {
      sampled = true;
      const selected = new Map();
      for (let index = 0; index &lt; 48; index++) {
        const group = groups[Math.round(index * (groups.length - 1) / 47)];
        selected.set(group.key, group);
      }
      const teachingGroup = groups.find(group =&gt; group.key === teachingKey);
      if (teachingGroup &amp;&amp; !selected.has(teachingGroup.key)) {
        const firstKey = selected.keys().next().value;
        selected.delete(firstKey);
        selected.set(teachingGroup.key, teachingGroup);
      }
      groups = [...selected.values()].sort((a, b) =&gt; {
        const derivativeA = -a.g.A * Math.sin(theta) + a.g.B * Math.cos(theta);
        const derivativeB = -b.g.A * Math.sin(theta) + b.g.B * Math.cos(theta);
        return derivativeA - derivativeB || a.g.A - b.g.A || a.g.B - b.g.B || a.g.C - b.g.C;
      });
    }
    groups.forEach((group, index) =&gt; { group.generatorIndex = index; });
    const items = groups.map(group =&gt; ({
      itemKey: group.key,
      cageKey: group.representative.cage.facets.join(&#x27;,&#x27;),
      group,
      pattern: group.representative
    }));
    const teachingIndex = Math.max(0, items.findIndex(item =&gt; item.itemKey === teachingKey));
    const orderedItems = [...items.slice(teachingIndex), ...items.slice(0, teachingIndex)];
    return {groups, items: orderedItems, fullGroupCount, sampled, patternsTruncated: active.truncated, activeCageCount: active.activeCageCount};
  }

  function solveThreePlanes(a, b, c, values) {
    const determinant = det3(a, b, c);
    if (Math.abs(determinant) &lt;= 1e-10) return null;
    return scale3(1 / determinant, add3(
      add3(scale3(values[0], cross3(b, c)), scale3(values[1], cross3(c, a))),
      scale3(values[2], cross3(a, b))
    ));
  }

  function fitFromEvaluation(evaluation) {
    const bounds = outerSolid.faces.map((face, index) =&gt; face.h - evaluation.mu * evaluation.supports[index]);
    const feasibleVertices = [];
    const seen = new Set();
    for (let i = 0; i &lt; outerSolid.faces.length - 2; i++) for (let j = i + 1; j &lt; outerSolid.faces.length - 1; j++) for (let k = j + 1; k &lt; outerSolid.faces.length; k++) {
      const point = solveThreePlanes(outerSolid.faces[i].normal, outerSolid.faces[j].normal, outerSolid.faces[k].normal, [bounds[i], bounds[j], bounds[k]]);
      if (!point) continue;
      const violation = Math.max(...outerSolid.faces.map((face, index) =&gt; dot3(face.normal, point) - bounds[index]));
      if (violation &gt; 2e-7) continue;
      const key = `${point.x.toFixed(7)},${point.y.toFixed(7)},${point.z.toFixed(7)}`;
      if (!seen.has(key)) { seen.add(key); feasibleVertices.push(point); }
    }
    let translation = v3(0, 0, 0);
    if (feasibleVertices.length) translation = scale3(1 / feasibleVertices.length, feasibleVertices.reduce((sum, point) =&gt; add3(sum, point), v3(0, 0, 0)));
    const polygonVertices = evaluation.rotatedVertices.map(point =&gt; add3(translation, scale3(evaluation.mu, point)));
    const slacks = outerSolid.faces.map((face, index) =&gt; face.h - dot3(face.normal, translation) - evaluation.mu * evaluation.supports[index]);
    const tightFaces = slacks.map((slack, index) =&gt; slack &lt;= 2e-6 ? index : -1).filter(index =&gt; index &gt;= 0);
    const contacts = tightFaces.map(facet =&gt; {
      const points = evaluation.ties[facet].map(vertex =&gt; polygonVertices[vertex]);
      return {facet, points, point: scale3(1 / points.length, points.reduce((sum, point) =&gt; add3(sum, point), v3(0, 0, 0)))};
    });
    const contactKeys = new Set(contacts.map(contact =&gt; contact.points
      .map(point =&gt; `${point.x.toFixed(6)},${point.y.toFixed(6)},${point.z.toFixed(6)}`)
      .sort().join(&#x27;|&#x27;)));
    return {
      ...evaluation,
      bounds,
      translation,
      polygonVertices,
      slacks,
      tightFaces,
      contacts,
      contactLocationCount: contactKeys.size,
      maxViolation: Math.max(...slacks.map(slack =&gt; -slack))
    };
  }

  function winnerPattern(evaluation, cageIndex) {
    const cage = cages[cageIndex];
    return patternForCage(cageIndex, evaluation, cage.facets.map(facet =&gt; evaluation.firstVertices[facet]));
  }

  function vectorRank(vectors) {
    const basis = [];
    vectors.forEach(vector =&gt; {
      let residual = {...vector};
      basis.forEach(unit =&gt; { residual = sub3(residual, scale3(dot3(residual, unit), unit)); });
      if (norm3(residual) &gt; 1e-8) basis.push(unit3(residual));
    });
    return basis.length;
  }

  function buildSliceData() {
    const envelope = [];
    const branchMap = new Map();
    for (let degrees = 0; degrees &lt;= 360; degrees += 2) {
      const evaluation = evaluate(degrees * DEG, false);
      envelope.push({degrees, d: evaluation.d});
      evaluation.scores.forEach((score, cageIndex) =&gt; {
        if (evaluation.d - score &gt; 2e-8 * Math.max(1, evaluation.d)) return;
        const pattern = winnerPattern(evaluation, cageIndex);
        const key = coefficientKey(pattern.g);
        if (!branchMap.has(key)) branchMap.set(key, pattern.g);
      });
    }
    let best = {degrees: 0, d: Infinity};
    const coarseStep = 0.25;
    for (let degrees = 0; degrees &lt; 360; degrees += coarseStep) {
      const d = evaluate(degrees * DEG, false).d;
      if (d &lt; best.d - 1e-10) best = {degrees, d};
    }
    const center = best.degrees;
    for (let index = -50; index &lt;= 50; index++) {
      const degrees = mod(center + index * coarseStep / 50, 360);
      const d = evaluate(degrees * DEG, false).d;
      if (d &lt; best.d - 1e-12 || Math.abs(d - best.d) &lt;= 1e-12 &amp;&amp; degrees &lt; best.degrees) best = {degrees, d};
    }
    return {envelope, branches: [...branchMap.values()], bestAngle: best.degrees, bestD: best.d};
  }

  function setupSvg(svg, ratio = 1) {
    const width = Math.max(280, Math.round(svg.getBoundingClientRect().width || 340));
    const height = Math.round(width / ratio);
    svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`);
    svg.replaceChildren();
    svg.appendChild(node(&#x27;rect&#x27;, {x: 16, y: 16, width: width - 32, height: height - 32, class: &#x27;pcg-frame&#x27;}));
    return {width, height};
  }

  function cameraViewRotate(point) {
    return rotateAboutAxis(rotateAboutAxis(point, AXES.z, cameraYaw), AXES.x, cameraPitch);
  }

  function diagramViewRotate(point) {
    return rotateAboutAxis(rotateAboutAxis(point, AXES.z, DEFAULT_CAMERA.yaw), AXES.x, DEFAULT_CAMERA.pitch);
  }

  function drawPhysical(fit, pattern) {
    const box = setupSvg(physicalSvg);
    const span = Math.min(box.width, box.height) - 58;
    const project = point =&gt; {
      const viewed = cameraViewRotate(point);
      return {x: box.width / 2 + viewed.x * span * 0.38, y: box.height / 2 - viewed.y * span * 0.38, z: viewed.z};
    };
    const selectedFacets = new Set(pattern.contributions.map(item =&gt; item.facet));
    const tightFacets = new Set(fit.tightFaces);
    const outerProjected = outerSolid.vertices.map(project);
    const innerProjected = fit.polygonVertices.map(project);
    const faceDepth = (face, projected) =&gt; face.vertices.reduce((sum, index) =&gt; sum + projected[index].z, 0) / face.vertices.length;
    const faceFacing = (face, rotatedNormal = face.normal) =&gt; cameraViewRotate(rotatedNormal).z &gt;= 0;
    const axisStart = project(scale3(-1.18, axis));
    const axisEnd = project(scale3(1.18, axis));
    physicalSvg.appendChild(node(&#x27;line&#x27;, {x1: axisStart.x, y1: axisStart.y, x2: axisEnd.x, y2: axisEnd.y, class: &#x27;pcg-world-axis&#x27;}));
    const drawOuterFace = face =&gt; {
      const classes = [&#x27;pcg-outer-face&#x27;];
      if (!faceFacing(face)) classes.push(&#x27;pcg-back&#x27;);
      if (tightFacets.has(face.index)) classes.push(&#x27;pcg-tight&#x27;);
      physicalSvg.appendChild(node(&#x27;polygon&#x27;, {
        points: face.vertices.map(index =&gt; `${outerProjected[index].x},${outerProjected[index].y}`).join(&#x27; &#x27;),
        class: classes.join(&#x27; &#x27;)
      }));
    };
    const sortedOuter = [...outerSolid.faces].sort((a, b) =&gt; faceDepth(a, outerProjected) - faceDepth(b, outerProjected));
    sortedOuter.filter(face =&gt; !faceFacing(face)).forEach(drawOuterFace);
    const sortedInner = [...innerSolid.faces].map(face =&gt; ({
      face,
      normal: rotateAboutAxis(face.normal, axis, fit.theta)
    })).sort((a, b) =&gt; faceDepth(a.face, innerProjected) - faceDepth(b.face, innerProjected));
    sortedInner.forEach(({face, normal}) =&gt; {
      const classes = [&#x27;pcg-inner-face&#x27;];
      if (!faceFacing(face, normal)) classes.push(&#x27;pcg-back&#x27;);
      physicalSvg.appendChild(node(&#x27;polygon&#x27;, {
        points: face.vertices.map(index =&gt; `${innerProjected[index].x},${innerProjected[index].y}`).join(&#x27; &#x27;),
        class: classes.join(&#x27; &#x27;)
      }));
    });
    sortedOuter.filter(face =&gt; faceFacing(face)).forEach(drawOuterFace);
    pattern.contributions.forEach(item =&gt; {
      const face = outerSolid.faces[item.facet];
      physicalSvg.appendChild(node(&#x27;polygon&#x27;, {
        points: face.vertices.map(index =&gt; `${outerProjected[index].x},${outerProjected[index].y}`).join(&#x27; &#x27;),
        class: &#x27;pcg-selected-outline&#x27;
      }));
    });

    const defs = node(&#x27;defs&#x27;);
    const marker = node(&#x27;marker&#x27;, {id: &#x27;pcg-physical-arrow&#x27;, viewBox: &#x27;0 0 6 6&#x27;, refX: 5.2, refY: 3, markerWidth: 5, markerHeight: 5, orient: &#x27;auto&#x27;});
    marker.appendChild(node(&#x27;path&#x27;, {d: &#x27;M0,0 L6,3 L0,6 Z&#x27;, class: &#x27;pcg-arrowhead&#x27;}));
    defs.appendChild(marker);
    physicalSvg.appendChild(defs);
    fit.contacts.forEach(contact =&gt; {
      const point = project(contact.point);
      if (contact.points.length === 2) {
        const endpoints = contact.points.map(project);
        physicalSvg.appendChild(node(&#x27;line&#x27;, {x1: endpoints[0].x, y1: endpoints[0].y, x2: endpoints[1].x, y2: endpoints[1].y, class: &#x27;pcg-contact-feature&#x27;}));
      } else if (contact.points.length &gt; 2) {
        const center = contact.point;
        const faceNormal = outerSolid.faces[contact.facet].normal;
        let basisU = sub3(contact.points[0], center);
        if (norm3(basisU) &gt; 1e-10) {
          basisU = unit3(basisU);
          const basisV = cross3(faceNormal, basisU);
          const ordered = [...contact.points].sort((a, b) =&gt; {
            const da = sub3(a, center), db = sub3(b, center);
            return Math.atan2(dot3(da, basisV), dot3(da, basisU)) - Math.atan2(dot3(db, basisV), dot3(db, basisU));
          }).map(project);
          physicalSvg.appendChild(node(&#x27;polygon&#x27;, {points: ordered.map(item =&gt; `${item.x},${item.y}`).join(&#x27; &#x27;), class: &#x27;pcg-contact-feature&#x27;}));
        }
      }
      physicalSvg.appendChild(node(&#x27;circle&#x27;, {cx: point.x, cy: point.y, r: 4, class: &#x27;pcg-contact&#x27;}));
      if (!selectedFacets.has(contact.facet)) return;
      const normalEnd = project(add3(contact.point, scale3(0.22, outerSolid.faces[contact.facet].normal)));
      physicalSvg.appendChild(node(&#x27;line&#x27;, {
        x1: point.x, y1: point.y, x2: normalEnd.x, y2: normalEnd.y,
        class: &#x27;pcg-normal&#x27;, &#x27;marker-end&#x27;: &#x27;url(#pcg-physical-arrow)&#x27;
      }));
      physicalSvg.appendChild(node(&#x27;circle&#x27;, {cx: point.x, cy: point.y, r: 7, class: &#x27;pcg-contact-ring&#x27;}));
      physicalSvg.appendChild(node(&#x27;circle&#x27;, {cx: normalEnd.x, cy: normalEnd.y, r: 9, class: &#x27;pcg-face-badge&#x27;}));
      textNode(physicalSvg, String(contact.facet + 1), normalEnd.x, normalEnd.y, &#x27;pcg-face-number&#x27;, &#x27;middle&#x27;);
    });

    const outerCenter = project(v3(0, 0, 0));
    const innerCenter = project(fit.translation);
    physicalSvg.appendChild(node(&#x27;line&#x27;, {x1: outerCenter.x, y1: outerCenter.y, x2: innerCenter.x, y2: innerCenter.y, class: &#x27;pcg-center-link&#x27;}));
    if (norm3(fit.translation) &lt;= 2e-6) physicalSvg.appendChild(node(&#x27;circle&#x27;, {cx: outerCenter.x, cy: outerCenter.y, r: 10, class: &#x27;pcg-center-halo&#x27;}));
    physicalSvg.appendChild(node(&#x27;circle&#x27;, {cx: outerCenter.x, cy: outerCenter.y, r: 5, class: &#x27;pcg-center-outer&#x27;}));
    physicalSvg.appendChild(node(&#x27;circle&#x27;, {cx: innerCenter.x, cy: innerCenter.y, r: 3.5, class: &#x27;pcg-center-inner&#x27;}));
    textNode(physicalSvg, `${axisControl.value}-axis`, Math.max(38, Math.min(box.width - 38, axisEnd.x)), Math.max(30, Math.min(box.height - 24, axisEnd.y - 7)), &#x27;pcg-world-axis-label&#x27;, &#x27;middle&#x27;);
    return {selectedFacets: [...selectedFacets].sort((a, b) =&gt; a - b)};
  }

  function chainIntoBox(vectors, left, top, width, height) {
    const points = [{x: 0, y: 0}];
    vectors.forEach(vector =&gt; points.push({x: points.at(-1).x + vector.x, y: points.at(-1).y + vector.y}));
    const xs = points.map(point =&gt; point.x), ys = points.map(point =&gt; point.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const rangeX = maxX - minX, rangeY = maxY - minY;
    const factors = [];
    if (rangeX &gt; 1e-10) factors.push((width - 34) / rangeX);
    if (rangeY &gt; 1e-10) factors.push((height - 28) / rangeY);
    const factor = factors.length ? Math.min(...factors) : 1;
    const centerX = (minX + maxX) / 2, centerY = (minY + maxY) / 2;
    return points.map(point =&gt; ({
      x: left + width / 2 + factor * (point.x - centerX),
      y: top + height / 2 - factor * (point.y - centerY)
    }));
  }

  function drawNumberedChain(svg, chain, contributions, markerId, bounds) {
    contributions.forEach((item, index) =&gt; {
      const a = chain[index], b = chain[index + 1];
      const length = Math.hypot(b.x - a.x, b.y - a.y);
      if (length &gt; 0.8) svg.appendChild(node(&#x27;line&#x27;, {x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: &#x27;pcg-vector&#x27;, &#x27;marker-end&#x27;: `url(#${markerId})`}));
      else svg.appendChild(node(&#x27;circle&#x27;, {cx: a.x, cy: a.y, r: 2.5, class: &#x27;pcg-contact&#x27;}));
    });
    const placed = [];
    contributions.forEach((item, index) =&gt; {
      const a = chain[index], b = chain[index + 1];
      const dx = b.x - a.x, dy = b.y - a.y;
      const length = Math.hypot(dx, dy);
      const normal = length &gt; 1 ? {x: -dy / length, y: dx / length} : {x: Math.cos(index * TAU / contributions.length), y: Math.sin(index * TAU / contributions.length)};
      const midpoint = {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2};
      const lanes = [14, -14, 29, -29];
      let badge = null;
      for (const lane of lanes) {
        const candidate = {
          x: Math.max(bounds.left + 10, Math.min(bounds.right - 10, midpoint.x + lane * normal.x)),
          y: Math.max(bounds.top + 10, Math.min(bounds.bottom - 10, midpoint.y + lane * normal.y))
        };
        if (placed.every(other =&gt; Math.hypot(candidate.x - other.x, candidate.y - other.y) &gt;= 20)) { badge = candidate; break; }
      }
      badge ??= {x: midpoint.x + 14 * normal.x, y: midpoint.y + 14 * normal.y};
      placed.push(badge);
      const distance = Math.hypot(badge.x - midpoint.x, badge.y - midpoint.y);
      if (distance &gt; 2) {
        const ratio = Math.max(0, distance - 10) / distance;
        svg.appendChild(node(&#x27;line&#x27;, {x1: midpoint.x, y1: midpoint.y, x2: midpoint.x + ratio * (badge.x - midpoint.x), y2: midpoint.y + ratio * (badge.y - midpoint.y), class: &#x27;pcg-badge-leader&#x27;}));
      }
      svg.appendChild(node(&#x27;circle&#x27;, {cx: badge.x, cy: badge.y, r: 9, class: &#x27;pcg-contribution-badge&#x27;}));
      textNode(svg, String(item.facet + 1), badge.x, badge.y, &#x27;pcg-contribution-number&#x27;, &#x27;middle&#x27;);
    });
  }

  function drawBridge(pattern, generatorNumber) {
    const width = Math.max(280, Math.round(bridgeSvg.getBoundingClientRect().width || 340));
    const height = Math.max(570, Math.min(620, Math.round(width * 1.35)));
    const dividerY = Math.round(height * 0.55);
    bridgeSvg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`);
    bridgeSvg.style.aspectRatio = `${width} / ${height}`;
    bridgeSvg.replaceChildren();
    const defs = node(&#x27;defs&#x27;);
    const vectorMarker = node(&#x27;marker&#x27;, {id: &#x27;pcg-vector-arrow&#x27;, viewBox: &#x27;0 0 6 6&#x27;, refX: 5.2, refY: 3, markerWidth: 5, markerHeight: 5, orient: &#x27;auto&#x27;});
    vectorMarker.appendChild(node(&#x27;path&#x27;, {d: &#x27;M0,0 L6,3 L0,6 Z&#x27;, class: &#x27;pcg-arrowhead&#x27;}));
    const resultMarker = node(&#x27;marker&#x27;, {id: &#x27;pcg-result-arrow&#x27;, viewBox: &#x27;0 0 6 6&#x27;, refX: 5.2, refY: 3, markerWidth: 5, markerHeight: 5, orient: &#x27;auto&#x27;});
    resultMarker.appendChild(node(&#x27;path&#x27;, {d: &#x27;M0,0 L6,3 L0,6 Z&#x27;, class: &#x27;pcg-result-arrowhead&#x27;}));
    defs.append(vectorMarker, resultMarker);
    bridgeSvg.appendChild(defs);
    bridgeSvg.appendChild(node(&#x27;rect&#x27;, {x: 16, y: 16, width: width - 32, height: height - 32, class: &#x27;pcg-frame&#x27;}));

    const projected = pattern.contributions.map(item =&gt; {
      const viewed = diagramViewRotate(item.weightedNormal);
      return {...item, projectedNormal: {x: viewed.x, y: viewed.y}};
    });
    const contributions = [...projected].sort((a, b) =&gt; Math.atan2(a.projectedNormal.y, a.projectedNormal.x) - Math.atan2(b.projectedNormal.y, b.projectedNormal.x));
    const generatorLabel = `g${subscriptNumber(generatorNumber)}`;
    const faceNumbers = contributions.map(item =&gt; item.facet + 1);
    const normalEquation = faceNumbers.map(number =&gt; `λ${subscriptNumber(number)}n${subscriptNumber(number)}`).join(&#x27; + &#x27;) + &#x27; = 0&#x27;;

    textNode(bridgeSvg, &#x27;STEP 1 · CLOSE THE 3D NORMAL LOOP&#x27;, 28, 36, &#x27;pcg-step-title&#x27;);
    textNode(bridgeSvg, &#x27;The spatial arrows are projected onto this page.&#x27;, 28, 54, &#x27;pcg-step-note&#x27;);
    textNode(bridgeSvg, normalEquation, width / 2, 76, &#x27;pcg-step-equation&#x27;, &#x27;middle&#x27;);
    const topBounds = {left: 34, right: width - 34, top: 90, bottom: dividerY - 78};
    const topChain = chainIntoBox(contributions.map(item =&gt; item.projectedNormal), topBounds.left, topBounds.top, topBounds.right - topBounds.left, topBounds.bottom - topBounds.top);
    if (Math.hypot(topChain.at(-1).x - topChain[0].x, topChain.at(-1).y - topChain[0].y) &lt;= 0.7) topChain[topChain.length - 1] = {...topChain[0]};
    bridgeSvg.appendChild(node(&#x27;circle&#x27;, {cx: topChain[0].x, cy: topChain[0].y, r: 9, class: &#x27;pcg-closure-halo&#x27;}));
    drawNumberedChain(bridgeSvg, topChain, contributions, &#x27;pcg-vector-arrow&#x27;, topBounds);
    textNode(bridgeSvg, &#x27;circled point: start = finish = 0&#x27;, width / 2, dividerY - 57, &#x27;pcg-balance-label&#x27;, &#x27;middle&#x27;);
    const cageRank = vectorRank(contributions.map(item =&gt; item.normal));
    const slideDirections = 3 - cageRank;
    textNode(bridgeSvg, &#x27;No translation improves every chosen bound.&#x27;, width / 2, dividerY - 35, &#x27;pcg-balance-label&#x27;, &#x27;middle&#x27;);
    textNode(bridgeSvg, slideDirections
      ? `${slideDirections} tangential slide direction${slideDirections === 1 ? &#x27;&#x27; : &#x27;s&#x27;} remain${slideDirections === 1 ? &#x27;s&#x27; : &#x27;&#x27;}.`
      : &#x27;The cage spans 3D: no first-order slide remains.&#x27;, width / 2, dividerY - 18, &#x27;pcg-balance-label&#x27;, &#x27;middle&#x27;);

    bridgeSvg.appendChild(node(&#x27;line&#x27;, {x1: 28, y1: dividerY, x2: width / 2 - 78, y2: dividerY, class: &#x27;pcg-divider&#x27;}));
    bridgeSvg.appendChild(node(&#x27;line&#x27;, {x1: width / 2 + 78, y1: dividerY, x2: width - 28, y2: dividerY, class: &#x27;pcg-divider&#x27;}));
    textNode(bridgeSvg, &#x27;↓  keep the same λ’s&#x27;, width / 2, dividerY + 4, &#x27;pcg-same-weights&#x27;, &#x27;middle&#x27;);

    textNode(bridgeSvg, `STEP 2 · BUILD AXIS-SLICE BRANCH ${generatorLabel}`, 28, dividerY + 34, &#x27;pcg-step-title&#x27;);
    textNode(bridgeSvg, &#x27;Each contact adds coefficients (A, B, C)&#x27;, 28, dividerY + 52, &#x27;pcg-step-note&#x27;);
    textNode(bridgeSvg, &#x27;from the matrix term λ n pᵀ.&#x27;, 28, dividerY + 68, &#x27;pcg-step-note&#x27;);
    textNode(bridgeSvg, `f${subscriptNumber(generatorNumber)}(θ) = C + A cos θ + B sin θ`, width / 2, dividerY + 88, &#x27;pcg-step-equation&#x27;, &#x27;middle&#x27;);
    const bottomTop = dividerY + 106;
    const bottomBounds = {left: 34, right: width - 34, top: bottomTop, bottom: height - 58};
    const bottomChain = chainIntoBox(contributions.map(item =&gt; ({x: item.coefficient.A, y: item.coefficient.B})), bottomBounds.left, bottomBounds.top, bottomBounds.right - bottomBounds.left, bottomBounds.bottom - bottomBounds.top);
    bridgeSvg.appendChild(node(&#x27;line&#x27;, {x1: bottomChain[0].x, y1: bottomChain[0].y, x2: bottomChain.at(-1).x, y2: bottomChain.at(-1).y, class: &#x27;pcg-result&#x27;, &#x27;marker-end&#x27;: &#x27;url(#pcg-result-arrow)&#x27;}));
    drawNumberedChain(bridgeSvg, bottomChain, contributions, &#x27;pcg-vector-arrow&#x27;, bottomBounds);
    bridgeSvg.appendChild(node(&#x27;circle&#x27;, {cx: bottomChain[0].x, cy: bottomChain[0].y, r: 5, class: &#x27;pcg-zero&#x27;}));
    bridgeSvg.appendChild(node(&#x27;circle&#x27;, {cx: bottomChain.at(-1).x, cy: bottomChain.at(-1).y, r: 6, class: &#x27;pcg-current-point&#x27;}));
    const g = pattern.g;
    textNode(bridgeSvg, `${generatorLabel}: A=${g.A.toFixed(4)}, B=${g.B.toFixed(4)}, C=${g.C.toFixed(4)}`, width / 2, height - 25, &#x27;pcg-result-label&#x27;, &#x27;middle&#x27;);
    return {faceNumbers: [...faceNumbers].sort((a, b) =&gt; a - b), contributionCount: contributions.length, balanceResidual: pattern.cage.balanceResidual, cageRank, slideDirections};
  }

  function pathData(points, mapX, mapY) {
    return points.map((point, index) =&gt; `${index ? &#x27;L&#x27; : &#x27;M&#x27;}${mapX(point.degrees).toFixed(2)},${mapY(point.value).toFixed(2)}`).join(&#x27; &#x27;);
  }

  function drawChart(theta, selectedGroup, generatorNumber, currentD) {
    const width = Math.max(280, Math.round(chartSvg.getBoundingClientRect().width || 340));

    const envelopeValues = sliceData.envelope.map(point =&gt; point.d);
    let yMin = Math.min(...envelopeValues), yMax = Math.max(...envelopeValues);
    const padding = Math.max(0.025 * Math.max(1, yMax), 0.08 * (yMax - yMin || 1));
    yMin -= padding;
    yMax += padding;
    const mapX = degrees =&gt; plot.left + degrees / 360 * (plot.right - plot.left);
    const mapY = value =&gt; plot.bottom - (value - yMin) / (yMax - yMin) * (plot.bottom - plot.top);
    chartGeometry = {plot, width, height};

    const defs = node(&#x27;defs&#x27;);
    const clip = node(&#x27;clipPath&#x27;, {id: &#x27;pcg-chart-clip&#x27;});
    clip.appendChild(node(&#x27;rect&#x27;, {x: plot.left, y: plot.top, width: plot.right - plot.left, height: plot.bottom - plot.top}));
    defs.appendChild(clip);
    chartSvg.appendChild(defs);
    chartSvg.appendChild(node(&#x27;rect&#x27;, {x: plot.left, y: plot.top, width: plot.right - plot.left, height: plot.bottom - plot.top, class: &#x27;pcg-frame&#x27;}));

    const yTicks = [yMin + 0.15 * (yMax - yMin), (yMin + yMax) / 2, yMax - 0.15 * (yMax - yMin)];
    yTicks.forEach(value =&gt; {
      const y = mapY(value);
      chartSvg.appendChild(node(&#x27;line&#x27;, {x1: plot.left, y1: y, x2: plot.right, y2: y, class: &#x27;pcg-grid&#x27;}));
      textNode(chartSvg, value.toFixed(3), plot.left - 7, y + 4, &#x27;pcg-tick&#x27;, &#x27;end&#x27;);
    });
    [0, 90, 180, 270, 360].forEach(degrees =&gt; {
      const x = mapX(degrees);
      chartSvg.appendChild(node(&#x27;line&#x27;, {x1: x, y1: plot.top, x2: x, y2: plot.bottom, class: &#x27;pcg-grid&#x27;}));
      textNode(chartSvg, `${degrees}°`, x, plot.bottom + 18, &#x27;pcg-tick&#x27;, &#x27;middle&#x27;);
    });
    textNode(chartSvg, &#x27;rotation θ&#x27;, (plot.left + plot.right) / 2, height - 9, &#x27;pcg-axis-title&#x27;, &#x27;middle&#x27;);
    const yTitle = textNode(chartSvg, &#x27;cage score&#x27;, 13, (plot.top + plot.bottom) / 2, &#x27;pcg-axis-title&#x27;, &#x27;middle&#x27;);
    yTitle.setAttribute(&#x27;transform&#x27;, `rotate(-90 13 ${(plot.top + plot.bottom) / 2})`);

    const branchMap = new Map(sliceData.branches.map(g =&gt; [coefficientKey(g), g]));
    branchMap.set(selectedKey, selectedGroup.g);

    if (branchValues.length &gt; 24) {

      branchValues = branchValues.filter(g =&gt; coefficientKey(g) !== selectedKey);

    textNode(chartSvg, `g${subscriptNumber(generatorNumber)} touches d(θ)`, currentX + (labelRight ? 8 : -8), Math.max(plot.top + 14, currentY - 9), &#x27;pcg-chart-label pcg-purple-label&#x27;, labelRight ? &#x27;start&#x27; : &#x27;end&#x27;);
    const bestRight = bestX &lt; plot.right - 95;
    textNode(chartSvg, &#x27;sampled slice best&#x27;, bestX + (bestRight ? 8 : -8), Math.min(plot.bottom - 7, bestY + 17), &#x27;pcg-chart-label pcg-orange-label&#x27;, bestRight ? &#x27;start&#x27; : &#x27;end&#x27;);

  function configure() {

  function draw() {

    const sampling = view.sampled || view.patternsTruncated ? ` Showing representative branches (${view.items.length} of ${view.fullGroupCount || view.items.length}).` : &#x27;&#x27;;
    const rankNote = bridgeState.slideDirections
      ? ` Their span has rank ${bridgeState.cageRank}, leaving ${bridgeState.slideDirections} neutral slide direction${bridgeState.slideDirections === 1 ? &#x27;&#x27; : &#x27;s&#x27;}.`

      : `Current: d=${evaluation.d.toFixed(6)} → μ=${fit.mu.toFixed(6)}&lt;br&gt;Sampled slice best: d≈${sliceData.bestD.toFixed(6)} → μ≈${sliceScale.toFixed(6)} at θ≈${sliceData.bestAngle.toFixed(3)}°.`;

    root.dataset.branchGap = String(branchGap);
    root.dataset.maxViolation = String(Math.max(0, fit.maxViolation));

    root.dataset.cageRank = String(bridgeState.cageRank);
    root.dataset.exampleCount = String(view.items.length);
    root.dataset.outerFaceCount = String(outerSolid.faces.length);
    root.dataset.innerVertexCount = String(innerSolid.vertices.length);
    root.dataset.selectedItemKey = selectedItem.itemKey;
    root.dataset.scale = String(fit.mu);
    root.dataset.cameraYaw = String(cameraYaw);
    root.dataset.cameraPitch = String(cameraPitch);
    resetViewButton.disabled = Math.abs(cameraYaw - DEFAULT_CAMERA.yaw) &lt;= 1e-10 &amp;&amp; Math.abs(cameraPitch - DEFAULT_CAMERA.pitch) &lt;= 1e-10;

  function selectAdjacent(delta) {
    const currentIndex = currentItems.findIndex(item =&gt; item.itemKey === selectedItemKey);
    if (currentIndex &lt; 0) return;
    const nextIndex = Math.max(0, Math.min(currentItems.length - 1, currentIndex + delta));
    if (nextIndex === currentIndex) return;
    const item = currentItems[nextIndex];
    selectedItemKey = item.itemKey;
    selectedCageKey = item.cageKey;

  function redrawPhysicalView() {
    physicalRedrawFrame = null;
    if (!currentPhysicalFit || !currentPhysicalPattern) return;
    drawPhysical(currentPhysicalFit, currentPhysicalPattern);
    root.dataset.cameraYaw = String(cameraYaw);
    root.dataset.cameraPitch = String(cameraPitch);
    resetViewButton.disabled = Math.abs(cameraYaw - DEFAULT_CAMERA.yaw) &lt;= 1e-10 &amp;&amp; Math.abs(cameraPitch - DEFAULT_CAMERA.pitch) &lt;= 1e-10;

    const dy = event.clientY - orbitLastPoint.y;
    orbitLastPoint = {x: event.clientX, y: event.clientY};

      cameraYaw = mod(cameraYaw + dx * orbitRadiansPerPixel + Math.PI, TAU) - Math.PI;
      cameraPitch = Math.max(-1.49, Math.min(1.49, cameraPitch + dy * orbitRadiansPerPixel));

  });

  physicalSvg.addEventListener(&#x27;pointercancel&#x27;, finishOrbit);
  physicalSvg.addEventListener(&#x27;lostpointercapture&#x27;, event =&gt; {
    if (event.pointerId !== orbitPointerId) return;
    orbitPointerId = null;
    orbitLastPoint = null;
    physicalSvg.classList.remove(&#x27;pcg-is-dragging&#x27;);
  });
  resetViewButton.addEventListener(&#x27;click&#x27;, () =&gt; {
    cameraYaw = DEFAULT_CAMERA.yaw;
    cameraPitch = DEFAULT_CAMERA.pitch;
    schedulePhysicalRedraw();

  new ResizeObserver(draw).observe(bridgeSvg);
